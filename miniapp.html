<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Empire Pro - AI Fitness & Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google MediaPipe kutubxonalari AI uchun -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(21, 29, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent: #ffb703;
            --accent-glow: rgba(255, 183, 3, 0.4);
            --purple: #8b5cf6;
            --green: #10b981;
            --text: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--bg) 70%);
            color: var(--text);
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
            user-select: none; overflow: hidden; position: relative;
        }

        .header {
            position: relative; z-index: 2; text-align: center; padding: 15px;
            background: var(--card-bg); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
        }

        .balance-box {
            font-size: 38px; font-weight: 900; color: var(--accent);
            text-shadow: 0 0 25px var(--accent-glow);
        }

        .nav-tabs {
            position: relative; z-index: 2; display: flex; justify-content: space-around;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px);
            padding: 8px 5px; border-bottom: 1px solid var(--card-border);
        }
        .tab-btn {
            background: none; border: none; color: #94a3b8; font-size: 11px;
            font-weight: 700; cursor: pointer; padding: 8px 10px; border-radius: 12px;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #fff; background: linear-gradient(135deg, rgba(255,183,3,0.25), rgba(139,92,246,0.25));
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }

        .tab-content {
            position: relative; z-index: 2; display: none; flex-direction: column;
            align-items: center; justify-content: center; flex-grow: 1; padding: 15px;
            overflow-y: auto;
        }
        .tab-content.active { display: flex; }

        /* 3D Coin Animation */
        .coin-container { perspective: 1000px; display: flex; justify-content: center; align-items: center; }
        .coin {
            width: 180px; height: 180px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe169 0%, #ffb703 50%, #d97706 100%);
            display: flex; align-items: center; justify-content: center; font-size: 75px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 60px var(--accent-glow);
            cursor: pointer; transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: coinFloat 3s ease-in-out infinite;
        }
        .coin:active { transform: scale(0.88) rotateX(10deg); }

        @keyframes coinFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating-num {
            position: absolute; color: #fff; font-weight: 900; font-size: 28px;
            pointer-events: none; z-index: 99; text-shadow: 0 0 10px var(--accent-glow);
            animation: floatUp 0.8s forwards ease-out;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
        }

        /* Glass Cards */
        .glass-card {
            width: 100%; max-width: 330px; background: var(--card-bg);
            backdrop-filter: blur(20px); padding: 14px; border-radius: 16px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .action-btn {
            background: linear-gradient(135deg, #ffb703, #fb8500); border: none;
            padding: 8px 14px; border-radius: 10px; font-weight: 900; color: #000;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255,183,3,0.4);
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.95); }

        /* AI Fitness Kamera Stili */
        .camera-wrapper {
            position: relative; width: 100%; max-width: 320px; height: 380px;
            border-radius: 20px; overflow: hidden; border: 2px solid var(--purple);
            box-shadow: 0 0 30px rgba(139,92,246,0.4); background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #webcam {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        .fitness-overlay {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 10px; border-radius: 12px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .footer {
            position: relative; z-index: 2; padding: 14px 20px;
            background: var(--card-bg); border-top: 1px solid var(--card-border);
        }
        .progress-bar {
            width: 100%; background: rgba(255,255,255,0.05); height: 8px;
            border-radius: 8px; overflow: hidden;
        }
        .progress-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, #ffb703, #10b981);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">🪙 <span id="score">0</span></div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'tap')">⚡ Tap</button>
        <button class="tab-btn" onclick="switchTab(event, 'fitness')">🤖 AI Fitness</button>
        <button class="tab-btn" onclick="switchTab(event, 'stars')">⭐ Stars</button>
    </div>

    <!-- TAP PAGE -->
    <div id="tap" class="tab-content active">
        <div class="coin-container">
            <div class="coin" id="coinBtn">🪙</div>
        </div>
    </div>

    <!-- AI FITNESS PAGE (KAMERA BILAN OTJIMANIYA) -->
    <div id="fitness" class="tab-content">
        <h3 style="margin-top: 0; color: var(--purple);">💪 Otjimaniya & AI</h3>
        <p style="color: #94a3b8; font-size: 11px; text-align: center; margin-top: -5px; margin-bottom: 12px;">
            Kameraga qarab otjimaniya qiling, har bir to'g'ri bajarilgan mashq uchun <b>+50 </b> olasiz!
        </p>

        <div class="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <div class="fitness-overlay">
                <div style="font-size: 13px; color: #94a3b8;">Sanoq: <b id="pushupCount" style="color: var(--accent); font-size: 18px;">0</b></div>
                <div id="aiStatus" style="font-size: 11px; color: var(--green); margin-top: 3px;">Kamera ishga tushmoqda...</div>
            </div>
        </div>
    </div>

    <!-- STARS ALMASHTIRISH (5,000 COIN = 1 STAR) -->
    <div id="stars" class="tab-content">
        <h3>⭐ Telegram Stars</h3>
        <p style="color: #94a3b8; font-size: 11px; text-align: center;">Yig'ilgan coinlarni Stars'ga almashtiring!</p>

        <div class="glass-card">
            <div>
                <div><b>⭐ 1 Telegram Star</b></div>
                <small style="color: #94a3b8;">Narxi: 5,000 🪙</small>
            </div>
            <button class="action-btn" onclick="withdrawStars(1, 5000)">Olish</button>
        </div>

        <div class="glass-card">
            <div>
                <div><b>⭐ 5 Telegram Stars</b></div>
                <small style="color: #94a3b8;">Narxi: 25,000 🪙</small>
            </div>
            <button class="action-btn" onclick="withdrawStars(5, 25000)">Olish</button>
        </div>
    </div>

    <div class="footer">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; font-weight: 700;">
            <span>⚡ Energiya</span>
            <span><span id="energy">500</span> / <span id="maxEnergy">500</span></span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="energyFill"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        let score = 0;
        let energy = 500, maxEnergy = 500;
        let pushups = 0;
        let exerciseState = "up"; // 'up' yoki 'down'

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energy').innerText = energy;
            document.getElementById('maxEnergy').innerText = maxEnergy;
            document.getElementById('energyFill').style.width = Math.max(0, Math.min(100, (energy / maxEnergy * 100))) + '%';
        }

        // Tap qilganda
        document.getElementById('coinBtn').addEventListener('pointerdown', (e) => {
            if (energy >= 1) {
                score += 1;
                energy -= 1;
                updateUI();

                let floatNum = document.createElement('div');
                floatNum.className = 'floating-num';
                floatNum.innerText = '+1';
                floatNum.style.left = (e.clientX - 15) + 'px';
                floatNum.style.top = (e.clientY - 30) + 'px';
                document.body.appendChild(floatNum);
                setTimeout(() => floatNum.remove(), 800);

                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });

        // AI Fitness Kamera va MediaPipe Pose Sozlamasi
        const videoElement = document.getElementById('webcam');
        let poseInstance = null;

        function onResults(results) {
            if (!results.poseLandmarks) return;
            
            // Elkalar va tirsaklar koordinatalarini olamiz (Oddiy mantiq: Y o'qi orqali pastga tushib chiqqanini aniqlash)
            let shoulders = results.poseLandmarks[11]; // Chap elka
            let hips = results.poseLandmarks[23];      // Chap son

            if (shoulders && hips) {
                document.getElementById('aiStatus').innerText = "Holat yaxshi! Mashqni bajaring 🦾";
                
                // Piksellar bo'yicha tana egilishini tekshirish (Otjimaniya simulyatsiyasi)
                let bodyHeight = Math.abs(shoulders.y - hips.y);
                
                if (bodyHeight < 0.35 && exerciseState === "up") {
                    exerciseState = "down";
                } else if (bodyHeight >= 0.35 && exerciseState === "down") {
                    exerciseState = "up";
                    pushups++;
                    score += 50; // Har bir to'g'ri otjimaniya uchun +50 coin
                    updateUI();
                    document.getElementById('pushupCount').innerText = pushups;
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }
            }
        }

        // Kamerani yoqish va MediaPipe ishga tushirish
        async function initCamera() {
            try {
                const pose = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });
                pose.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                pose.onResults(onResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await pose.send({image: videoElement});
                    },
                    width: 320,
                    height: 380
                });
                camera.start();
            } catch (err) {
                document.getElementById('aiStatus').innerText = "Kameraga ruxsat berilmadi!";
            }
        }

        // Stars almashtirish
        function withdrawStars(stars, cost) {
            if (score < cost) {
                alert(`Coin yetarli emas! Sizga ${cost.toLocaleString()} 🪙 kerak.`);
                return;
            }
            score -= cost;
            updateUI();
            alert(`✅ ${stars} Star uchun ariza qabul qilindi. Operatorlar tekshirib o'tkazib beradi.`);
        }

        function switchTab(e, name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            e.target.classList.add('active');

            // Agar fitness bo'linsa kamerani faollashtiramiz
            if(name === 'fitness' && !poseInstance) {
                initCamera();
                poseInstance = true;
            }
        }

        // Energiyani asta-sekin tiklash
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
        }, 3000);

        updateUI();
    </script>
</body>
</html>
