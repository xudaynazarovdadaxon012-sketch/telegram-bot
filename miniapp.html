<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Pro Hub Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(22, 27, 38, 0.65);
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-gold: #ffd700;
            --text-main: #f0f6fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background: var(--bg-color); color: var(--text-main); overflow-x: hidden; padding-bottom: 90px; }

        /* Neon Background Glows */
        .glow-1 { position: fixed; top: -100px; left: -100px; width: 300px; height: 300px; background: var(--neon-purple); filter: blur(140px); opacity: 0.4; z-index: -1; }
        .glow-2 { position: fixed; bottom: 50px; right: -100px; width: 300px; height: 300px; background: var(--neon-blue); filter: blur(140px); opacity: 0.3; z-index: -1; }

        /* Glassmorphism Header */
        .header {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 20px 15px; border-radius: 0 0 24px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .username-badge { font-size: 13px; color: #8b949e; letter-spacing: 0.5px; }
        .coins-display {
            font-size: 46px; font-weight: 900; margin: 10px 0;
            background: linear-gradient(135deg, #fff 0%, var(--neon-gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }

        /* Energy Progress Bar */
        .energy-box { width: 90%; margin: 0 auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 14px; }
        .energy-text { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-bottom: 6px; }
        .energy-bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
        .energy-bar-fill { height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); width: 100%; transition: width 0.2s ease; border-radius: 10px; }

        /* Content Tabs */
        .tab-content { display: none; padding: 20px 15px; }
        .active-tab { display: block; }

        /* Tap Button UI */
        .tap-area { margin: 40px 0; position: relative; }
        .tap-btn {
            width: 230px; height: 230px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1f6feb, #061539);
            border: 4px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.2);
            color: #fff; font-size: 36px; font-weight: 900; outline: none; cursor: pointer;
            touch-action: manipulation; position: relative;
        }
        .tap-btn:active { transform: scale(0.95); }

        .floating-num {
            position: absolute; color: var(--neon-gold); font-size: 32px; font-weight: 900;
            pointer-events: none; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        /* Cards List */
        .card-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .card-item {
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 16px;
            display: flex; justify-content: space-between; align-items: center; text-align: left;
        }
        .btn-neon {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none; color: #fff; font-weight: 700; padding: 10px 16px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3); cursor: pointer; transition: 0.2s;
        }
        .btn-neon:active { transform: scale(0.92); }

        /* Admin Dashboard UI */
        .admin-panel { background: rgba(15, 20, 32, 0.85); border: 1px solid var(--neon-gold); border-radius: 20px; padding: 18px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .stat-box { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box h4 { font-size: 22px; color: var(--neon-gold); }

        /* Bottom Nav Bar */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(13, 17, 26, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; padding: 12px 0;
            z-index: 100;
        }
        .nav-item { color: #8b949e; background: none; border: none; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--neon-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="header">
        <div class="username-badge" id="username">@User</div>
        <div class="coins-display">🪙 <span id="coin-count">0</span></div>
        <div class="energy-box">
            <div class="energy-text">
                <span>⚡ Energiya</span>
                <span><b id="energy-val">1000</b> / <span id="max-energy">1000</span></span>
            </div>
            <div class="energy-bar-bg"><div class="energy-bar-fill" id="energy-fill"></div></div>
        </div>
    </div>

    <!-- 1. TAP TAB -->
    <div id="tab-tap" class="tab-content active-tab">
        <div class="tap-area">
            <button class="tap-btn" id="tap-btn">TAP</button>
        </div>
    </div>

    <!-- 2. BOOST TAB -->
    <div id="tab-boost" class="tab-content">
        <h3 style="text-align: left; font-size: 20px;">🚀 Boosters</h3>
        <div class="card-list">
            <div class="card-item">
                <div><h4>Multitap</h4><p style="font-size: 12px; color: #8b949e;">Har bir tapga +1 tanga</p></div>
                <button class="btn-neon" onclick="buyBoost('multitap')">1,000 🪙</button>
            </div>
            <div class="card-item">
                <div><h4>Energy Limit</h4><p style="font-size: 12px; color: #8b949e;">+500 Maksimal Energiya</p></div>
                <button class="btn-neon" onclick="buyBoost('energy')">1,500 🪙</button>
            </div>
        </div>
    </div>

    <!-- 3. SPIN TAB -->
    <div id="tab-spin" class="tab-content">
        <h3 style="font-size: 20px;">🎰 Omad G'ildiragi</h3>
        <p style="color: #8b949e; font-size: 13px; margin: 10px 0 20px 0;">Har kuni 1 marotaba bepul omadingizni sinab ko'ring!</p>
        <button class="btn-neon" style="width: 100%; padding: 14px;" onclick="spinWheel()">Spin Aylantirish (Bonus)</button>
    </div>

    <!-- 4. ADMIN TAB -->
    <div id="tab-admin" class="tab-content">
        <div class="admin-panel">
            <h3 style="color: var(--neon-gold); display: flex; align-items: center; justify-content: center; gap: 8px;">👑 Admin Control Center</h3>
            <div class="stat-grid">
                <div class="stat-box"><h4 id="adm-users">0</h4><p style="font-size: 11px; color: #8b949e;">Foydalanuvchilar</p></div>
                <div class="stat-box"><h4 id="adm-coins">0</h4><p style="font-size: 11px; color: #8b949e;">Jami Tangalar</p></div>
            </div>
            <h4 style="text-align: left; margin: 15px 0 10px 0; font-size: 14px;">Foydalanuvchilarni Boshqarish:</h4>
            <div class="card-list" id="admin-user-list"></div>
        </div>
    </div>

    <!-- NAV BAR -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('tap', this)">🎮 Tap</button>
        <button class="nav-item" onclick="switchTab('boost', this)">🚀 Boost</button>
        <button class="nav-item" onclick="switchTab('spin', this)">🎰 Spin</button>
        <button class="nav-item" id="nav-admin" style="display:none;" onclick="switchTab('admin', this)">👑 Admin</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tgUser = tg.initDataUnsafe?.user;
        const userId = tgUser?.id || 8898979946;
        const username = tgUser?.username ? `@${tgUser.username}` : "User";

        document.getElementById("username").innerText = username;

        let coins = 0, energy = 1000, maxEnergy = 1000;

        async function initApp() {
            try {
                const res = await fetch('/api/user/sync', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, username: username })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    coins = data.data.coins;
                    energy = data.data.energy;
                    maxEnergy = data.data.max_energy;

                    if(data.is_admin) {
                        document.getElementById('nav-admin').style.display = 'flex';
                    }
                    updateUI();
                }
            } catch(e) { console.error(e); }
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = coins.toLocaleString();
            document.getElementById('energy-val').innerText = energy;
            document.getElementById('max-energy').innerText = maxEnergy;
            document.getElementById('energy-fill').style.width = (energy / maxEnergy * 100) + "%";
        }

        const tapBtn = document.getElementById('tap-btn');
        tapBtn.addEventListener('click', (e) => {
            if (energy < 1) return;
            coins += 1; energy -= 1;
            updateUI();

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            // GSAP Animatsiyasi (Tugma bosilishi)
            gsap.to(tapBtn, { scale: 0.93, duration: 0.05, yoyo: true, repeat: 1 });

            // Floating Number Animatsiyasi
            const rect = tapBtn.getBoundingClientRect();
            const floatingNum = document.createElement('div');
            floatingNum.className = 'floating-num';
            floatingNum.innerText = '+1';
            floatingNum.style.left = `${e.clientX - rect.left}px`;
            floatingNum.style.top = `${e.clientY - rect.top}px`;
            tapBtn.parentElement.appendChild(floatingNum);

            gsap.to(floatingNum, {
                y: -70, opacity: 0, duration: 0.7, ease: "power1.out",
                onComplete: () => floatingNum.remove()
            });

            fetch('/api/tap', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, count: 1 })
            });
        });

        async function buyBoost(type) {
            const res = await fetch('/api/boost/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, type: type })
            });
            const data = await res.json();
            if(data.status === 'success') { alert('Boost xarid qilindi!'); initApp(); }
            else { alert(data.error); }
        }

        function spinWheel() {
            const win = Math.floor(Math.random() * 5000) + 1000;
            coins += win;
            updateUI();
            alert(`Tabriklaymiz! Spin'dan ${win} tanga yutib oldingiz!`);
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active-tab');
            el.classList.add('active');

            if(tabName === 'admin') fetchAdmin();
        }

        async function fetchAdmin() {
            const res = await fetch('/api/admin/stats', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ admin_id: userId })
            });
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('adm-users').innerText = data.stats.total_users;
                document.getElementById('adm-coins').innerText = data.stats.total_coins.toLocaleString();
                const list = document.getElementById('admin-user-list');
                list.innerHTML = '';
                data.users.forEach(u => {
                    list.innerHTML += `
                        <div class="card-item">
                            <div>
                                <h5 style="color:#fff;">${u.username}</h5>
                                <p style="font-size:11px; color:#8b949e;">ID: ${u.telegram_id} | 🪙 ${u.coins.toLocaleString()}</p>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <button class="btn-neon" style="padding:6px 10px; font-size:11px;" onclick="adminAct('add_coins', ${u.telegram_id})">+50K</button>
                                <button class="btn-neon" style="padding:6px 10px; font-size:11px; background:${u.is_banned ? '#238636' : '#da3633'};" onclick="adminAct('${u.is_banned ? 'unban' : 'ban'}', ${u.telegram_id})">
                                    ${u.is_banned ? 'Unban' : 'Ban'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function adminAct(act, target) {
            await fetch('/api/admin/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ admin_id: userId, action: act, target_id: target })
            });
            fetchAdmin();
        }

        initApp();
    </script>
</body>
</html>
