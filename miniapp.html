<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Yordamchi</title>
    <!-- Telegram Mini App JS kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Asosiy Dizayn - Neon / Dark Theme */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212; /* To'q fon */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Animatsiya paytida skroll bo'lmasligi uchun */
        }

        /* Kirish ekrani animatsiyasi */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease-out; /* Sekin yo'qolish */
        }

        #splash-logo {
            font-size: 3rem;
            color: #00e676; /* Neon yashil */
            text-shadow: 0 0 10px #00e676, 0 0 20px #00e676;
            animation: pulse 2s infinite; /* Puls animatsiyasi */
        }

        /* Puls animatsiyasi */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Asosiy menyu (Splash yashiringandan keyin ko'rinadi) */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        /* Dinamik salomlashish matni */
        #user-welcome {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Neon tugmalar dizayni */
        .neon-button {
            background: none;
            border: 2px solid #00e676;
            color: #00e676;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            margin: 10px 0;
            width: 80%;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .neon-button:hover {
            background-color: #00e676;
            color: #121212;
            box-shadow: 0 0 10px #00e676, 0 0 30px #00e676;
        }

        /* Tugma bosilganda (Ripple effekti JavaScriptda boshqariladi) */
        .neon-button.active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <!-- 1. Kirish Ekrani (Splash) -->
    <div id="splash-screen">
        <div id="splash-logo">🤖</div>
        <p>Yuklanmoqda...</p>
    </div>

    <!-- 2. Asosiy Kontent -->
    <div id="main-content">
        <div id="user-welcome">Assalomu alaykum, <span id="user-name">Foydalanuvchi</span>!</div>
        
        <button class="neon-button" id="btn-weather">Ob-havo</button>
        <button class="neon-button" id="btn-currency">Valyuta kursi</button>
        <button class="neon-button" id="btn-reminder">Eslatma qo'shish</button>
    </div>

    <script>
        // Telegram Web App API initialize
        const tg = window.Telegram.WebApp;
        tg.expand(); // Mini App'ni to'liq ekranga yoyish

        // Sahifa yuklanganda ishlashi kerak bo'lgan funksiyalar
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Foydalanuvchi ismini chiqarish (Telegramdan olish)
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name;
            }

            // 2. Animatsiya va ekranlarni almashtirish
            setTimeout(function() {
                // Splash ekranni sekin yashirish
                document.getElementById('splash-screen').style.opacity = '0';
                
                // 1 soniyadan keyin to'liq yo'qotish va asosiy kontentni ko'rsatish
                setTimeout(function() {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'flex';
                    // Asosiy kontentni sekin paydo qilish
                    setTimeout(() => { document.getElementById('main-content').style.opacity = '1'; }, 10);
                }, 1000);
            }, 3000); // Splash ekrani 3 soniya tursin

            // 3. Tugmalar bosilganda animatsiya (Aktiv holat)
            const buttons = document.querySelectorAll('.neon-button');
            buttons.forEach(btn => {
                btn.addEventListener('mousedown', function() { this.classList.add('active'); });
                btn.addEventListener('mouseup', function() { this.classList.remove('active'); });
                btn.addEventListener('mouseleave', function() { this.classList.remove('active'); });
            });

            // 4. Tugmalar funksiyalari (Telegramga ma'lumot yuborish)
            document.getElementById('btn-weather').addEventListener('click', () => {
                tg.sendData('A:WEATHER'); // Python botga ma'lumot yuboradi
                tg.close(); // Mini Appni yopadi
            });

            document.getElementById('btn-currency').addEventListener('click', () => {
                tg.sendData('A:CURRENCY');
                tg.close();
            });

            document.getElementById('btn-reminder').addEventListener('click', () => {
                tg.sendData('A:ADD_REMINDER');
                tg.close();
            });
        });

    </script>
</body>
</html> lang="uz">
