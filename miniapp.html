<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mega AI Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --main-color: #0ea5e9; /* Sky Blue */
            --glass-bg: rgba(15, 23, 42, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* ------------------ Elite Glassmorphism Header ------------------ */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .user-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .coins-display {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fbbf24; /* Gold */
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
        }

        .coins-display img {
            width: 32px;
            height: 32px;
            margin-left: 10px;
            animation: coin-shine 3s ease-in-out infinite;
        }

        /* ------------------ Elite Neumorphic Tapper Button ------------------ */
        .tap-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
            position: relative;
        }

        .tap-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #131d36, #0e1628);
            box-shadow: 20px 20px 60px #090f1d, -20px -20px 60px #152037;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .tap-button:active {
            transform: scale(0.95);
            box-shadow: inset 5px 5px 15px #090f1d, inset -5px -5px 15px #152037;
        }

        .tap-button img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Tapper animatsiyasi: pulsatsiya */
        .tap-button::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px 10px rgba(14, 165, 233, 0.4);
            opacity: 0.1;
            animation: pulse-ring 2s infinite;
            pointer-events: none;
        }

        /* ------------------ Chotki animatsiyalar ------------------ */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.1; }
            50% { opacity: 0.3; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes coin-shine {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.3); }
        }

        /* Chotki bosish effekti: tilla tangalar animatsiyasi */
        .tap-particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fbbf24;
            border-radius: 50%;
            box-shadow: 0 0 10px #fbbf24;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes particle-fade-up {
            0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-name" id="user-name">Foydalanuvchi</div>
        <div class="coins-display">
            <span id="coins-count">0</span>
            <img src="https://em-content.zobj.net/source/apple/354/coin_1f4b0.png" alt="coin">
        </div>
    </div>

    <div class="tap-area">
        <div class="tap-button" id="tap-button">
            <img src="https://i.ibb.co/3W6pZq1/tap-image.png" alt="Tap Here"> </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Fullscreen
        tg.ready();

        // Foydalanuvchi nomini o'rnatish
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        let coins = 0;
        const coinsCountEl = document.getElementById('coins-count');
        const tapButton = document.getElementById('tap-button');

        // Tapper bosish mantiqi
        tapButton.addEventListener('click', (e) => {
            coins++;
            coinsCountEl.innerText = coins;

            // 1. CHOTKI ANIMATSIYA: Tilla zarrachalar
            createParticleAnimation(e);

            // 2. QULAYLIK: Haptic Feedback (Vibratsiya)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium'); 
            }
        });

        // Elite zarrachalar animatsiyasi
        function createParticleAnimation(event) {
            const tapArea = document.querySelector('.tap-area');
            const numParticles = 10;

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('tap-particle');
                tapArea.appendChild(particle);

                // Zarrachaning boshlang'ich pozitsiyasi: barmoq bosgan joy
                const x = event.clientX;
                const y = event.clientY - tapArea.offsetTop;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                // Tasodifiy xarakat yo'nalishi
                const driftX = (Math.random() - 0.5) * 200; // -100 dan +100 gacha
                const driftY = (Math.random() - 1.0) * 150; // -150 dan -0 gacha (tepaga)
                
                particle.style.setProperty('--x', `${driftX}px`);
                particle.style.setProperty('--y', `${driftY}px`);

                // Animatsiya davomiyligi
                const duration = Math.random() * 0.5 + 0.5; // 0.5s dan 1s gacha
                particle.style.animation = `particle-fade-up ${duration}s ease-out forwards`;

                // Animatsiya tugagach zarrachani o'chirish
                setTimeout(() => {
                    particle.remove();
                }, duration * 1000);
            }
        }
    </script>
</body>
</html>
