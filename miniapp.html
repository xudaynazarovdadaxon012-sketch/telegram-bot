<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cyber Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --accent-gold: #ffd700;
            --accent-cyan: #00f0ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 3D Glass Header */
        .header {
            padding: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .stats-container {
            text-align: center;
            padding: 20px 0;
            z-index: 10;
        }

        /* 3D Typography */
        .score-title {
            font-size: 14px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-val {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
            margin: 5px 0;
        }

        .rank-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 3D Canvas Viewport */
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
            cursor: pointer;
        }

        /* Floating Text Effects */
        .floating-num {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255,215,0,0.8), 0 3px 0 #000;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        /* Footer Controls & Progress */
        .footer {
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            z-index: 10;
        }

        .energy-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
        }

        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            box-shadow: 0 0 10px #ff416c;
            transition: width 0.2s ease;
        }

        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a0aab8;
        }

        /* 3D Push Buttons */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(180deg, #1f293d 0%, #111827 100%);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0b0f19;
            transition: all 0.1s ease;
            text-align: center;
        }

        .tab-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0b0f19;
        }

        /* Modal / Views */
        .view-panel {
            display: none;
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 160px;
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(15px);
            z-index: 50;
            padding: 20px;
            overflow-y: auto;
        }

        .view-panel.active {
            display: block;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buy-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--accent-cyan), #0072ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="user-avatar" id="avatar">U</div>
            <div>
                <div id="uName" style="font-weight: bold; font-size: 14px;">Foydalanuvchi</div>
                <div style="font-size: 11px; color: #7a8b9e;" id="hwStatus">FPS: 60 | Ping: 24ms</div>
            </div>
        </div>
        <div class="rank-badge" id="rankBadge">Bronza</div>
    </div>

    <div class="stats-container">
        <div class="score-title">Jamlangan Balans</div>
        <div class="score-val" id="score">0</div>
    </div>

    <!-- 3D WebGL Canvas -->
    <div id="canvas-container"></div>

    <!-- Do'kon Paneli -->
    <div id="shopView" class="view-panel">
        <h2 style="margin-bottom: 15px; color: var(--accent-gold);">Kibernetik Do'kon</h2>
        <div class="card">
            <div>
                <div style="font-weight: bold;">Tap Kuchaytirgich (+1)</div>
                <div style="font-size: 12px; color: #8a99ad;">Narxi: <span id="tapCost">100</span> coin</div>
            </div>
            <button class="buy-btn" onclick="buyTapPower()">Oshirish</button>
        </div>
        <div class="card">
            <div>
                <div style="font-weight: bold;">Energiya Sig'imi (+50)</div>
                <div style="font-size: 12px; color: #8a99ad;">Narxi: 200 coin</div>
            </div>
            <button class="buy-btn" onclick="buyEnergyLimit()">Kengaytirish</button>
        </div>
    </div>

    <div class="footer">
        <div class="energy-bar-container">
            <div class="energy-fill" id="energyFill"></div>
        </div>
        <div class="energy-text">
            <span>⚡ Energiya</span>
            <span><strong id="energy">100</strong> / <span id="maxEnergy">100</span></span>
        </div>

        <div class="nav-tabs">
            <div class="tab-btn" onclick="toggleView('main')">🕹️ O'yin</div>
            <div class="tab-btn" onclick="toggleView('shopView')">🛒 Boostlar</div>
        </div>
    </div>

    <script>
        // Telegram WebApp Integratsiyasi
        const tg = window.Telegram?.WebApp;
        if(tg) {
            tg.expand();
            if(tg.initDataUnsafe?.user) {
                document.getElementById('uName').innerText = tg.initDataUnsafe.user.first_name;
                document.getElementById('avatar').innerText = tg.initDataUnsafe.user.first_name[0];
            }
        }

        // Saqlangan ma'lumotlarni yuklash (LocalStorage)
        let state = JSON.parse(localStorage.getItem('cyber_clicker_data')) || {
            score: 0,
            energy: 100,
            maxEnergy: 100,
            tapPower: 1,
            rank: 'Bronza'
        };

        function saveData() {
            localStorage.setItem('cyber_clicker_data', JSON.stringify(state));
        }

        function updateUI() {
            document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
            document.getElementById('energy').innerText = state.energy;
            document.getElementById('maxEnergy').innerText = state.maxEnergy;
            document.getElementById('tapCost').innerText = state.tapPower * 100;
            document.getElementById('energyFill').style.width = (state.energy / state.maxEnergy * 100) + '%';
            document.getElementById('rankBadge').innerText = state.rank;
            saveData();
        }

        // Web Audio API Sound Generation
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        // THREE.JS 3D Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 3D Coin Creation
        const geometry = new THREE.CylinderGeometry(2.2, 2.2, 0.3, 50);
        const material = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 0.9,
            roughness: 0.2,
            wireframe: false
        });
        const coin = new THREE.Mesh(geometry, material);
        coin.rotation.x = Math.PI / 3;
        scene.add(coin);

        // Lighting
        const light1 = new THREE.PointLight(0xffd700, 2, 50);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x00f0ff, 2, 50);
        light2.position.set(-5, -5, 5);
        scene.add(light2);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        camera.position.z = 7;

        // Interactive Tap Logic
        function handleTap(clientX, clientY) {
            if(state.energy >= state.tapPower) {
                state.score += state.tapPower;
                state.energy -= state.tapPower;

                if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                playClickSound();

                // 3D Coin Rotation Effect
                coin.rotation.y += 0.4;
                coin.rotation.x += 0.2;

                // Floating Text
                const ft = document.createElement('div');
                ft.className = 'floating-num';
                ft.innerText = '+' + state.tapPower;
                ft.style.left = clientX + 'px';
                ft.style.top = (clientY - 30) + 'px';
                document.body.appendChild(ft);
                setTimeout(() => ft.remove(), 800);

                updateUI();
            }
        }

        container.addEventListener('pointerdown', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        // Auto Energy Regen
        setInterval(() => {
            if(state.energy < state.maxEnergy) {
                state.energy = Math.min(state.maxEnergy, state.energy + 1);
                updateUI();
            }
        }, 1000);

        // Shop Functions
        function buyTapPower() {
            let cost = state.tapPower * 100;
            if(state.score >= cost) {
                state.score -= cost;
                state.tapPower += 1;
                updateUI();
            } else {
                alert("Tangalaringiz yetarli emas!");
            }
        }

        function buyEnergyLimit() {
            if(state.score >= 200) {
                state.score -= 200;
                state.maxEnergy += 50;
                state.energy = state.maxEnergy;
                updateUI();
            } else {
                alert("Tangalaringiz yetarli emas!");
            }
        }

        function toggleView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            if(viewId !== 'main') {
                document.getElementById(viewId).classList.add('active');
            }
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            coin.rotation.y += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Canvas
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        updateUI();
    </script>
</body>
</html>
