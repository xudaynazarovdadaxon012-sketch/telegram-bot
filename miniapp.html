<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Cyber Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card: rgba(20, 27, 45, 0.75);
            --border: rgba(0, 242, 254, 0.2);
            --accent: #00f2fe;
            --purple: #7928ca;
            --gold: #ff0080;
            --yellow: #f1c40f;
            --text: #ffffff;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.15), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(121, 40, 202, 0.15), transparent 60%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .header {
            padding: 15px;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .user-info { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
        .balance { 
            font-size: 32px; 
            font-weight: 900; 
            color: var(--accent); 
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            display: flex; align-items: center; justify-content: center; gap: 8px; 
        }

        .tabs { display: flex; background: rgba(9, 13, 22, 0.9); border-bottom: 1px solid var(--border); }
        .tab-btn {
            flex: 1; padding: 12px 4px; background: none; border: none;
            color: var(--text-sub); font-size: 10px; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #fff;
            border-bottom: 2px solid var(--accent);
            text-shadow: 0 0 8px var(--accent);
        }

        .content { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; overflow-y: auto; }
        .content.active { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* TAP ANIMATION */
        .coin-box { position: relative; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        .coin {
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00f2fe, #4facfe, #7928ca);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center; font-size: 70px; cursor: pointer;
            transition: transform 0.08s ease;
        }
        .coin:active { transform: scale(0.92); }

        .floating-text {
            position: absolute; color: var(--accent); font-weight: 900; font-size: 22px;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 8px #000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }

        /* CARD STYLE */
        .card {
            width: 100%; max-width: 340px; background: var(--card);
            backdrop-filter: blur(12px); border: 1px solid var(--border);
            border-radius: 20px; padding: 18px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent), #4facfe);
            border: none; border-radius: 12px; color: #000; font-weight: 900; cursor: pointer;
            font-size: 13px; margin-top: 10px; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-purple { background: linear-gradient(135deg, var(--purple), var(--gold)); color: #fff; }

        .input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--border); border-radius: 10px; color: #fff;
            text-align: center; margin: 10px 0; outline: none; font-size: 13px;
        }

        /* SPIN WHEEL */
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 15px auto; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--accent);
            background: conic-gradient(#ff0080 0deg 60deg, #7928ca 60deg 120deg, #00f2fe 120deg 180deg, #f1c40f 180deg 240deg, #10b981 240deg 300deg, #ef4444 300deg 360deg);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
        }
        .pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 22px solid #fff; z-index: 10; filter: drop-shadow(0 0 5px var(--accent));
        }

        .footer { padding: 15px 20px; background: var(--card); border-top: 1px solid var(--border); }
        .energy-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-top: 6px; }
        .energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); transition: width 0.2s; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">Foydalanuvchi: <b id="uName" style="color:#fff;">O'yinchi</b></div>
        <div class="balance">🪙 <span id="score">0</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('tap', event)">⚡ TAP</button>
        <button class="tab-btn" onclick="setTab('spin', event)">🎰 SPIN</button>
        <button class="tab-btn" onclick="setTab('quiz', event)">🧠 QUIZ</button>
        <button class="tab-btn" onclick="setTab('ref', event)">👥 DO'STLAR</button>
    </div>

    <!-- TAP SECTION -->
    <div id="tap" class="content active">
        <div class="coin-box" id="coinContainer">
            <div class="coin" id="tapBtn">🪙</div>
        </div>
        <div style="font-size: 12px; color: var(--text-sub);">Har bir bosish: <b style="color:var(--accent);">+<span id="powerText">1</span> Coin</b></div>
    </div>

    <!-- SPIN SECTION -->
    <div id="spin" class="content">
        <div class="card">
            <h3 style="color:var(--yellow); font-size: 16px;">🎰 Omadli G'ildirak</h3>
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel"></div>
            </div>
            <p style="font-size: 11px; color: var(--text-sub);">Narxi: <b>200 Coin</b></p>
            <div id="spinRes" style="font-size: 14px; font-weight: 800; margin: 8px 0; color: var(--accent);">Omadingizni sinang!</div>
            <button class="btn btn-purple" onclick="spinGame()">Aylantirish</button>
        </div>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quiz" class="content">
        <div class="card">
            <h4 style="font-size: 12px; color: var(--accent); margin-bottom: 6px;">TOPISHMOQ N°<span id="qNum">1</span></h4>
            <p id="qText" style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">...</p>
            <input type="text" id="ansInput" class="input" placeholder="Javobingizni yozing...">
            <button class="btn" onclick="checkAnswer()">Javobni Tekshirish</button>
        </div>
    </div>

    <!-- REFERRAL SECTION -->
    <div id="ref" class="content">
        <div class="card">
            <h3 style="font-size: 15px; margin-bottom: 6px;">👥 Do'stlarni taklif qiling</h3>
            <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 12px;">Har bir kirgan do'st uchun: <b style="color:var(--accent);">+1,000 Coin</b></p>
            <input type="text" id="refLink" class="input" readonly value="...">
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button class="btn btn-purple" onclick="shareRef()" style="flex: 1;">📲 Ulashish</button>
                <button class="btn" onclick="copyRef()" style="flex: 1;">📋 Nusxalash</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700;">
            <span>⚡ Energiya</span>
            <span><span id="energy">100</span> / 100</span>
        </div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api";
        const BOT_USERNAME = "kunlik_vazifalar_2026_bot";

        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let startParam = tg?.initDataUnsafe?.start_param || null;

        let AppState = {
            userId: tg?.initDataUnsafe?.user?.id || 123456,
            username: tg?.initDataUnsafe?.user?.first_name || "O'yinchi",
            score: 0, energy: 100, tapPower: 1, quizIndex: 0
        };

        const quizData = [
            { q: "Suvga tushsa ham ho'l bo'lmaydigan narsa nima?", a: "soya" },
            { q: "Qanchalik ko'p olsang, shunchalik kattalashadigan narsa?", a: "o'ra" }
        ];

        document.getElementById('uName').innerText = AppState.username;
        document.getElementById('refLink').value = `https://t.me/${BOT_USERNAME}?start=${AppState.userId}`;

        async function syncData() {
            try {
                let res = await fetch(`${API_URL}/sync`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: AppState.userId, username: AppState.username, refBy: startParam })
                });
                let data = await res.json();
                if(data.success) {
                    AppState.score = data.user.score;
                    AppState.energy = data.user.energy;
                    AppState.tapPower = data.user.tapPower || 1;
                    updateUI();
                }
            } catch(e) { updateUI(); }
        }

        function updateUI() {
            document.getElementById('score').innerText = AppState.score.toLocaleString();
            document.getElementById('energy').innerText = AppState.energy;
            document.getElementById('powerText').innerText = AppState.tapPower;
            document.getElementById('energyFill').style.width = AppState.energy + '%';
        }

        // TAP EVENT WITH ANIMATION
        document.getElementById('tapBtn').addEventListener('click', (e) => {
            if(AppState.energy >= AppState.tapPower) {
                AppState.score += AppState.tapPower;
                AppState.energy -= 1;
                updateUI();

                let floatText = document.createElement('div');
                floatText.className = 'floating-text';
                floatText.innerText = '+' + AppState.tapPower;
                floatText.style.left = (e.clientX - 15) + 'px';
                floatText.style.top = (e.clientY - 40) + 'px';
                document.body.appendChild(floatText);
                setTimeout(() => floatText.remove(), 800);

                fetch(`${API_URL}/tap`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: AppState.userId })
                }).catch(()=>{});
            }
        });

        // SPIN LOGIC
        let currentRotation = 0;
        async function spinGame() {
            if(AppState.score < 200) return alert("Aylantirish uchun 200 Coin kerak!");
            
            AppState.score -= 200; 
            updateUI();

            let prizes = [0, 100, 250, 500, 750, 1000];
            let randomIndex = Math.floor(Math.random() * prizes.length);
            let win = prizes[randomIndex];

            let degPerSlice = 360 / prizes.length;
            let targetDegree = (prizes.length - randomIndex) * degPerSlice - (degPerSlice / 2);
            currentRotation += 2160 + targetDegree;

            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(async () => {
                AppState.score += win; 
                updateUI();
                document.getElementById('spinRes').innerText = win > 0 ? `🎉 Yutuq: +${win} Coin!` : "😢 Tangalar tushmadi";
                
                await fetch(`${API_URL}/spin`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: AppState.userId, reward: win })
                }).catch(()=>{});
            }, 4000);
        }

        // QUIZ LOGIC
        function loadQuiz() {
            let item = quizData[AppState.quizIndex % quizData.length];
            document.getElementById('qNum').innerText = (AppState.quizIndex + 1);
            document.getElementById('qText').innerText = item.q;
        }

        function checkAnswer() {
            let ans = document.getElementById('ansInput').value.trim().toLowerCase();
            let item = quizData[AppState.quizIndex % quizData.length];
            if(ans === item.a) {
                AppState.score += 150; AppState.quizIndex++; updateUI(); loadQuiz();
                document.getElementById('ansInput').value = '';
                alert("To'g'ri javob! +150 Coin");
            } else alert("Noto'g'ri, qayta urinib ko'ring!");
        }

        // REFERRAL FUNCTIONS
        function shareRef() {
            let refLink = document.getElementById('refLink').value;
            let shareText = "🔥 Kirib tangalar yig'ing va sovrinlarga ega bo'ling!";
            let shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`;
            
            if (window.Telegram?.WebApp?.openTelegramLink) {
                window.Telegram.WebApp.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }
        }

        function copyRef() {
            let refInput = document.getElementById('refLink');
            refInput.select();
            refInput.setSelectionRange(0, 99999);

            try {
                navigator.clipboard.writeText(refInput.value).then(() => {
                    alert("Havola nusxalandi!");
                });
            } catch (err) {
                document.execCommand('copy');
                alert("Havola nusxalandi!");
            }
        }

        function setTab(name, e) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            e.currentTarget.classList.add('active');
            if(name === 'quiz') loadQuiz();
        }

        // Auto energy recovery locally
        setInterval(() => {
            if (AppState.energy < 100) {
                AppState.energy = Math.min(100, AppState.energy + 1);
                updateUI();
            }
        }, 3000);

        syncData();
    </script>
</body>
</html>
