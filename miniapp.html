<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mega AI Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .tab-btn.active {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
    }

    .section {
      display: none;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section.active { display: block; }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-box {
      height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent-purple);
      color: #fff;
    }

    .msg.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .result-box {
      min-height: 160px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Mega AI Assistant</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">🤖 Gemini AI</button>
    <button class="tab-btn" onclick="switchTab('image')">🎨 Rasm</button>
    <button class="tab-btn" onclick="switchTab('translate')">🌐 Tarjimon</button>
    <button class="tab-btn" onclick="switchTab('qr')">📱 QR Kod</button>
  </div>

  <!-- 1. Chat Section -->
  <div id="chat-section" class="section active">
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Assalomu alaykum! Men Google Gemini AI yordamchisiman. Yozishingiz mumkin! 🚀</div>
    </div>
    <div class="input-group">
      <input type="text" id="chatInput" placeholder="Xabar yozing..." onkeypress="if(event.key==='Enter') sendChatMessage()" />
      <button class="action-btn" onclick="sendChatMessage()">➤</button>
    </div>
  </div>

  <!-- 2. Image Section -->
  <div id="image-section" class="section">
    <div class="input-group">
      <input type="text" id="imgPrompt" placeholder="Rasm tavsifi..." />
      <button class="action-btn" onclick="generateAIImage()">Yaratish 🎨</button>
    </div>
    <div class="result-box" id="imgResult">
      <span style="color: var(--text-sub); font-size: 13px;">Rasm shu yerda ko'rinadi</span>
    </div>
  </div>

  <!-- 3. Translator -->
  <div id="translate-section" class="section">
    <div class="input-group" style="margin-bottom: 8px;">
      <select id="langTarget">
        <option value="Ingliz tiliga">Ingliz tiliga 🇬🇧</option>
        <option value="O'zbek tiliga">O'zbek tiliga 🇺🇿</option>
        <option value="Rus tiliga">Rus tiliga 🇷🇺</option>
      </select>
    </div>
    <div class="input-group">
      <input type="text" id="transInput" placeholder="Matn kiriting..." />
      <button class="action-btn" onclick="translateText()">O'girish</button>
    </div>
    <div class="result-box" id="transResult">
      <span style="color: var(--text-sub); font-size: 13px;">Natija shu yerda chiqadi</span>
    </div>
  </div>

  <!-- 4. QR Code -->
  <div id="qr-section" class="section">
    <div class="input-group">
      <input type="text" id="qrInput" placeholder="Matn yoki havola..." />
      <button class="action-btn" onclick="generateQR()">Yaratish</button>
    </div>
    <div class="result-box" id="qrResult">
      <span style="color: var(--text-sub); font-size: 13px;">QR kod shu yerda ko'rinadi</span>
    </div>
  </div>
</div>

<script>
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Gemini API Key:
  const GEMINI_API_KEY = "AQ.Ab8RN6L2igzuU1PwAjNL5m05qqQryDYsyCfhUF-piN482VDiow";

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

    const tabs = ['chat', 'image', 'translate', 'qr'];
    const idx = tabs.indexOf(tab);
    if (idx !== -1) {
      document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      document.getElementById(`${tab}-section`).classList.add('active');
    }
  }

  // To'g'ridan-to'g'ri Gemini API so'rovi (sahifa bloklanmaydi)
  async function callGeminiAI(promptText) {
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await res.json();
      if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
        return data.candidates[0].content.parts[0].text;
      } else {
        return "Javob olishda xatolik yuz berdi.";
      }
    } catch (e) {
      return "Ulanishda xatolik yuz berdi.";
    }
  }

  function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const box = document.getElementById('chatBox');
    const text = input.value.trim();

    if (!text) return;
    input.value = '';

    box.innerHTML += `<div class="msg user">${text}</div>`;
    box.scrollTop = box.scrollHeight;

    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg ai';
    aiMsg.innerText = "Yozilmoqda... ⏳";
    box.appendChild(aiMsg);
    box.scrollTop = box.scrollHeight;

    // Orqa fonda mustaqil ishlaydi (GUI bloklanmaydi)
    callGeminiAI(`O'zbek tilida xushfeli javob ber: ${text}`).then(reply => {
      aiMsg.innerText = reply;
      box.scrollTop = box.scrollHeight;
    });
  }

  function generateAIImage() {
    const promptInput = document.getElementById('imgPrompt');
    const resBox = document.getElementById('imgResult');
    const text = promptInput.value.trim();
    if (!text) return;

    resBox.innerHTML = `<span style="color: var(--accent-cyan);">Rasm tayyorlanmoqda... 🎨</span>`;
    const seed = Math.floor(Math.random() * 99999);
    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=400&height=400&seed=${seed}&nologo=true`;

    const img = new Image();
    img.src = imgUrl;
    img.style.width = "100%";
    img.style.borderRadius = "10px";
    img.onload = () => { resBox.innerHTML = ''; resBox.appendChild(img); };
    img.onerror = () => { resBox.innerHTML = `<span style="color: red;">Rasm yuklanmadi.</span>`; };
  }

  function translateText() {
    const input = document.getElementById('transInput').value.trim();
    const target = document.getElementById('langTarget').value;
    const resBox = document.getElementById('transResult');
    if (!input) return;

    resBox.innerHTML = `<span style="color: var(--accent-cyan);">Tarjima qilinmoqda... 🌐</span>`;
    callGeminiAI(`Matnni ${target} tarjima qil va faqat tarjimaning o'zini ber: ${input}`).then(result => {
      resBox.innerHTML = `<strong style="color:#fff;">${result}</strong>`;
    });
  }

  function generateQR() {
    const input = document.getElementById('qrInput').value.trim();
    const resBox = document.getElementById('qrResult');
    if (!input) return;

    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(input)}`;
    resBox.innerHTML = `<img src="${qrUrl}" style="width:140px; height:140px;" />`;
  }
</script>
</body>
</html>
