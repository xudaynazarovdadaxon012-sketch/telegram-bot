<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mega AI Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            user-select: none;
        }

        .header {
            text-align: center;
            padding: 10px;
            background: #1e293b;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-item {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, background-color 0.2s;
        }

        .grid-item:active {
            transform: scale(0.96);
            background: #334155;
        }

        .full-width {
            grid-column: span 2;
        }

        .icon {
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="margin:0;">🎮 Mini App (O'yinlar & Hub)</h3>
    </div>

    <div class="grid-container">
        <div class="grid-item" onclick="sendAction('🤖 Sun\'iy Intellekt (AI)')"><span class="icon">🤖</span> Sun'iy Intellekt</div>
        <div class="grid-item" onclick="sendAction('🎨 AI Rasm Yaratish')"><span class="icon">🎨</span> AI Rasm Yaratish</div>
        <div class="grid-item" onclick="sendAction('📥 Video Yuklagich')"><span class="icon">📥</span> Video Yuklagich</div>
        <div class="grid-item" onclick="sendAction('📈 Kripto & Oltin')"><span class="icon">📈</span> Kripto & Oltin</div>
        <div class="grid-item" onclick="sendAction('🔗 Link Qisqartirish')"><span class="icon">🔗</span> Link Qisqartirish</div>
        <div class="grid-item" onclick="sendAction('🔤 Matn Tarjimon')"><span class="icon">🔤</span> Matn Tarjimon</div>
        <div class="grid-item" onclick="sendAction('📲 QR-Kod Yaratish')"><span class="icon">📲</span> QR-Kod Yaratish</div>
        <div class="grid-item" onclick="sendAction('🧮 Aqlli Kalkulyator')"><span class="icon">🧮</span> Aqlli Kalkulyator</div>
        <div class="grid-item" onclick="sendAction('🌤 Aniq Ob-havo')"><span class="icon">🌤</span> Aniq Ob-havo</div>
        <div class="grid-item" onclick="sendAction('💎 Valyuta kurslari')"><span class="icon">💎</span> Valyuta kurslari</div>
        <div class="grid-item full-width" onclick="sendAction('📝 Shaxsiy Eslatmalar')"><span class="icon">📝</span> Shaxsiy Eslatmalar</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendAction(text) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            tg.sendData(text);
            tg.close();
        }
    </script>
</body>
</html>
