<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mega AI Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
    }

    .section {
      display: none;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section.active {
      display: block;
    }

    .chat-box {
      height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
      padding-right: 4px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent-purple);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .msg.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    select option {
      background: var(--card-bg);
      color: #fff;
    }

    button.action-btn {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .result-box {
      min-height: 150px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      padding: 12px;
      text-align: center;
      overflow: hidden;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Mega AI Assistant</h1>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">🤖 Chat</button>
    <button class="tab-btn" onclick="switchTab('image')">🎨 Rasm</button>
    <button class="tab-btn" onclick="switchTab('translate')">🌐 Tarjimon</button>
    <button class="tab-btn" onclick="switchTab('qr')">📱 QR Kod</button>
    <button class="tab-btn" onclick="switchTab('stats')">📊 Statistika</button>
  </div>

  <!-- 1. AI Chat Section -->
  <div id="chat-section" class="section active">
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Assalomu alaykum! Savolingizni yozing, yordam berishdan xursandman. 😊</div>
    </div>
    <div class="input-group">
      <input type="text" id="chatInput" placeholder="Xabar yozing..." onkeypress="if(event.key==='Enter') sendChatMessage()" />
      <button class="action-btn" onclick="sendChatMessage()">➤</button>
    </div>
  </div>

  <!-- 2. AI Image Section -->
  <div id="image-section" class="section">
    <div class="input-group">
      <input type="text" id="imgPrompt" placeholder="Rasm tavsifi (masalan: yashil daraxt)..." />
      <button class="action-btn" onclick="generateAIImage()">Yaratish</button>
    </div>
    <div class="result-box" id="imgResult">
      <span style="color: var(--text-sub); font-size: 13px;">Rasm shu yerda ko'rinadi</span>
    </div>
  </div>

  <!-- 3. Translator Section -->
  <div id="translate-section" class="section">
    <div class="input-group" style="margin-bottom: 8px;">
      <select id="langTarget">
        <option value="Ingliz tiliga">Ingliz tiliga 🇬🇧</option>
        <option value="O'zbek tiliga">O'zbek tiliga 🇺🇿</option>
        <option value="Rus tiliga">Rus tiliga 🇷🇺</option>
      </select>
    </div>
    <div class="input-group">
      <input type="text" id="transInput" placeholder="Tarjima qilinadigan matn..." />
      <button class="action-btn" onclick="translateText()">O'girish</button>
    </div>
    <div class="result-box" id="transResult">
      <span style="color: var(--text-sub); font-size: 13px;">Natija shu yerda chiqadi</span>
    </div>
  </div>

  <!-- 4. QR Code Section -->
  <div id="qr-section" class="section">
    <div class="input-group">
      <input type="text" id="qrInput" placeholder="Havola yoki matn kiriting..." />
      <button class="action-btn" onclick="generateQR()">Yaratish</button>
    </div>
    <div class="result-box" id="qrResult">
      <span style="color: var(--text-sub); font-size: 13px;">QR kod shu yerda ko'rinadi</span>
    </div>
  </div>

  <!-- 5. Analytics Section -->
  <div id="stats-section" class="section">
    <div class="stat-card">
      <span>Umumiy so'rovlar:</span>
      <strong id="statRequests" style="color: var(--accent-cyan);">0</strong>
    </div>
    <div class="stat-card">
      <span>Tizim holati:</span>
      <strong style="color: #10b981;">Online (24/7)</strong>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) tg.expand();

  let requestCount = 0;

  function trackUsage() {
    requestCount++;
    document.getElementById('statRequests').innerText = requestCount;
    if (tg?.CloudStorage) {
      tg.CloudStorage.setItem('user_req_count', requestCount.toString());
    }
  }

  if (tg?.CloudStorage) {
    tg.CloudStorage.getItem('user_req_count', (err, val) => {
      if (!err && val) {
        requestCount = parseInt(val) || 0;
        document.getElementById('statRequests').innerText = requestCount;
      }
    });
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

    const tabNames = ['chat', 'image', 'translate', 'qr', 'stats'];
    const idx = tabNames.indexOf(tab);
    if (idx !== -1) {
      document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      document.getElementById(`${tab}-section`).classList.add('active');
    }
  }

  // 1. AI Chat
  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const box = document.getElementById('chatBox');
    const text = input.value.trim();

    if (!text) return;
    input.value = '';

    box.innerHTML += `<div class="msg user">${text}</div>`;
    box.scrollTop = box.scrollHeight;
    trackUsage();

    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg ai';
    aiMsg.innerText = "O'ylanmoqda... ⏳";
    box.appendChild(aiMsg);
    box.scrollTop = box.scrollHeight;

    try {
      const promptText = `Siz Telegram Mini App AI yordamchisiz. O'zbekcha javob bering: ${text}`;
      const url = `https://text.pollinations.ai/${encodeURIComponent(promptText)}`;

      const response = await fetch(url);
      const replyText = await response.text();

      if (response.ok && replyText && !replyText.includes("402 Payment")) {
        aiMsg.innerText = replyText;
      } else {
        aiMsg.innerText = "Sizning so'rovingiz qabul qilindi! Birozdan so'ng qayta urinib ko'ring.";
      }
    } catch (err) {
      aiMsg.innerText = "Tarmoqda xatolik yuz berdi.";
    }
    box.scrollTop = box.scrollHeight;
  }

  // 2. AI Image
  function generateAIImage() {
    const promptInput = document.getElementById('imgPrompt');
    const resBox = document.getElementById('imgResult');
    const rawPrompt = promptInput.value.trim();

    if (!rawPrompt) return alert("Matn kiriting!");

    resBox.innerHTML = `<span style="color: var(--accent-cyan); font-size: 13px;">Rasm chizilmoqda... 🎨</span>`;
    trackUsage();

    const seed = Math.floor(Math.random() * 999999);
    const imgUrl = `https://pollinations.ai/p/${encodeURIComponent(rawPrompt)}?width=512&height=512&seed=${seed}&model=flux&nologo=true`;

    const img = new Image();
    img.src = imgUrl;
    img.style.width = "100%";
    img.style.borderRadius = "12px";

    img.onload = () => { resBox.innerHTML = ''; resBox.appendChild(img); };
    img.onerror = () => { resBox.innerHTML = `<span style="color: var(--accent-pink);">Xatolik yuz berdi!</span>`; };
  }

  // 3. AI Translator
  async function translateText() {
    const input = document.getElementById('transInput').value.trim();
    const target = document.getElementById('langTarget').value;
    const resBox = document.getElementById('transResult');

    if (!input) return alert("Matn kiriting!");

    resBox.innerHTML = `<span style="color: var(--accent-cyan); font-size: 13px;">Tarjima qilinmoqda... 🌐</span>`;
    trackUsage();

    try {
      const promptText = `Quyidagi matnni aniq ${target} tarjima qil, faqat tarjimani o'zini qaytar: ${input}`;
      const url = `https://text.pollinations.ai/${encodeURIComponent(promptText)}`;

      const response = await fetch(url);
      const replyText = await response.text();

      if (response.ok && replyText) {
        resBox.innerHTML = `<strong style="color: #fff; font-size: 15px;">${replyText}</strong>`;
      } else {
        resBox.innerHTML = `<span style="color: var(--accent-pink);">Tarjimada xatolik bo'ldi.</span>`;
      }
    } catch (err) {
      resBox.innerHTML = `<span style="color: var(--accent-pink);">Tarmoq xatosi.</span>`;
    }
  }

  // 4. QR Code Generator
  function generateQR() {
    const input = document.getElementById('qrInput').value.trim();
    const resBox = document.getElementById('qrResult');

    if (!input) return alert("Matn yoki havola kiriting!");

    resBox.innerHTML = `<span style="color: var(--accent-cyan); font-size: 13px;">QR kod yaratilmoqda... 📱</span>`;
    trackUsage();

    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(input)}`;

    const img = new Image();
    img.src = qrUrl;
    img.style.width = "180px";
    img.style.height = "180px";
    img.style.borderRadius = "8px";

    img.onload = () => { resBox.innerHTML = ''; resBox.appendChild(img); };
    img.onerror = () => { resBox.innerHTML = `<span style="color: var(--accent-pink);">QR kod yaratib bo'lmadi.</span>`; };
  }
</script>
</body>
</html>
