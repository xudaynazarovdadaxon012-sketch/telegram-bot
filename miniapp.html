<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O'yinlar Hub - Mini App</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            user-select: none;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .game-frame {
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
        }
    </style>
</head>
<body class="p-4 flex flex-col justify-between">

    <!-- HEADER / USER INFO -->
    <div id="main-content">
        <div class="flex items-center justify-between mb-6 p-4 glass-card rounded-2xl">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg" id="user-avatar">
                    U
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight" id="user-name">Foydalanuvchi</h1>
                    <p class="text-xs text-indigo-300">Premium Game Zone</p>
                </div>
            </div>
            <div class="flex items-center space-x-1 bg-amber-500/20 px-3 py-1 rounded-full border border-amber-500/30">
                <i data-lucide="trophy" class="w-4 h-4 text-amber-400"></i>
                <span class="text-xs font-semibold text-amber-300">Pro Gamer</span>
            </div>
        </div>

        <!-- TITLE -->
        <div class="mb-4">
            <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400">
                🎮 TOP O'YINLAR HABI
            </h2>
            <p class="text-xs text-slate-400 mt-1">O'zingizga yoqgan o'yinni tanlang va bot ichida o'ynang!</p>
        </div>

        <!-- GAME LIST -->
        <div class="grid grid-cols-1 gap-4 mb-6">
            
            <!-- GAME 1: SUBWAY SURFERS -->
            <div onclick="openGame('https://play.famobi.com/subway-surfers')" class="glass-card p-4 rounded-2xl flex items-center justify-between active:scale-95 transition-transform cursor-pointer hover:border-indigo-500/50">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-tr from-amber-500 to-red-500 flex items-center justify-center text-2xl shadow-lg">
                        🏃
                    </div>
                    <div>
                        <h3 class="font-bold text-base">Subway Surfers</h3>
                        <p class="text-xs text-slate-400">Poyga & Sarguzasht</p>
                    </div>
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md">
                    O'ynash
                </button>
            </div>

            <!-- GAME 2: 2048 -->
            <div onclick="openGame('https://play2048.co/')" class="glass-card p-4 rounded-2xl flex items-center justify-between active:scale-95 transition-transform cursor-pointer hover:border-indigo-500/50">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-tr from-yellow-400 to-amber-600 flex items-center justify-center text-2xl shadow-lg">
                        🔢
                    </div>
                    <div>
                        <h3 class="font-bold text-base">2048 Puzzle</h3>
                        <p class="text-xs text-slate-400">Mantiqiy o'yin</p>
                    </div>
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md">
                    O'ynash
                </button>
            </div>

            <!-- GAME 3: PAC-MAN -->
            <div onclick="openGame('https://macosko.github.io/PAC-MAN/')" class="glass-card p-4 rounded-2xl flex items-center justify-between active:scale-95 transition-transform cursor-pointer hover:border-indigo-500/50">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-tr from-yellow-300 to-yellow-500 flex items-center justify-center text-2xl shadow-lg">
                        🟡
                    </div>
                    <div>
                        <h3 class="font-bold text-base">Pac-Man Classic</h3>
                        <p class="text-xs text-slate-400">Afsonaviy Arkani o'yin</p>
                    </div>
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md">
                    O'ynash
                </button>
            </div>

            <!-- GAME 4: TOWER BUILDER -->
            <div onclick="openGame('https://html5.gamedistribution.com/rvvAS394/c77467c6451a44139e802ee6d41be2a0/')" class="glass-card p-4 rounded-2xl flex items-center justify-between active:scale-95 transition-transform cursor-pointer hover:border-indigo-500/50">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-2xl shadow-lg">
                        🏙
                    </div>
                    <div>
                        <h3 class="font-bold text-base">Tower Master</h3>
                        <p class="text-xs text-slate-400">Minora qurish</p>
                    </div>
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md">
                    O'ynash
                </button>
            </div>

        </div>
    </div>

    <!-- GAME IFRAME CONTAINER (HIDE BY DEFAULT) -->
    <div id="game-container" class="hidden fixed inset-0 bg-slate-950 z-50 flex flex-col">
        <div class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <button onclick="closeGame()" class="flex items-center space-x-1 text-slate-300 bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-semibold">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Chiqish</span>
            </button>
            <span class="text-xs font-bold text-indigo-400">Mini App Game Zone</span>
            <div class="w-16"></div>
        </div>
        <iframe id="game-iframe" class="game-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        // Telegram WebApp obyektini yuklash
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.ready();
            tg.expand(); // Ekran bo'ylab yoyish
            
            // Foydalanuvchi ma'lumotlarini olish
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
            }
        }

        // Lucide belgilarni faollashtirish
        lucide.createIcons();

        // O'yinni ochish
        function openGame(url) {
            document.getElementById('game-iframe').src = url;
            document.getElementById('game-container').classList.remove('hidden');
            if (tg && tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(closeGame);
            }
        }

        // O'yinni yopish
        function closeGame() {
            document.getElementById('game-iframe').src = '';
            document.getElementById('game-container').classList.add('hidden');
            if (tg && tg.BackButton) {
                tg.BackButton.hide();
            }
        }
    </script>
</body>
</html>
