<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Pro Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
        body { background: #0b0e14; color: #ffffff; text-align: center; padding-bottom: 80px; overflow-x: hidden; }
        
        /* Header & Balance */
        .header { padding: 20px 15px; background: linear-gradient(180deg, #161b26 0%, #0b0e14 100%); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-card { font-size: 13px; color: #8b949e; letter-spacing: 0.5px; }
        .coins-container { font-size: 40px; font-weight: 800; color: #f1e05a; margin: 10px 0; text-shadow: 0 0 20px rgba(241, 224, 90, 0.4); display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* Energy Bar */
        .energy-box { width: 85%; margin: 10px auto; background: #161b22; padding: 8px 12px; border-radius: 12px; border: 1px solid #30363d; }
        .energy-text { font-size: 12px; color: #8b949e; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .energy-bar { width: 100%; background: #21262d; border-radius: 10px; height: 10px; overflow: hidden; }
        .energy-fill { background: linear-gradient(90deg, #388bfd, #58a6ff); height: 100%; width: 100%; transition: width 0.2s ease; }
        
        /* Tab Manager */
        .tab-content { display: none; padding: 20px 15px; animation: fadeIn 0.3s ease-in-out; }
        .active-tab { display: block; }

        /* Ideal Tap Button & Floating Text Animation */
        .tap-area { margin: 30px 0; position: relative; display: flex; justify-content: center; align-items: center; }
        .tap-btn {
            width: 230px; height: 230px; border-radius: 50%;
            background: radial-gradient(circle, #1f6feb 0%, #0d419d 100%);
            border: 6px solid rgba(56, 139, 253, 0.4); color: white; font-size: 32px; font-weight: 900;
            cursor: pointer; box-shadow: 0 0 40px rgba(31, 111, 235, 0.5), inset 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.08s ease, box-shadow 0.08s ease; outline: none; touch-action: manipulation;
        }
        .tap-btn:active { transform: scale(0.92); box-shadow: 0 0 15px rgba(31, 111, 235, 0.8); }

        /* Floating Number (+1 Effect) */
        .floating-number {
            position: absolute; color: #f1e05a; font-size: 28px; font-weight: bold;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* Card Elements (Boost, Task, Ref) */
        .card-list { display: flex; flex-direction: column; gap: 12px; }
        .card-item {
            background: #161b22; border: 1px solid #30363d; border-radius: 14px;
            padding: 16px; display: flex; justify-content: space-between; align-items: center; text-align: left;
            transition: transform 0.2s;
        }
        .card-item:active { transform: scale(0.98); }
        .card-info h4 { font-size: 15px; color: #ffffff; margin-bottom: 4px; }
        .card-info p { font-size: 12px; color: #8b949e; }
        .btn-action {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            border: none; color: white; padding: 10px 18px; border-radius: 8px;
            cursor: pointer; font-weight: 700; font-size: 13px; box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22;
            display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #30363d;
            backdrop-filter: blur(10px);
        }
        .nav-item { color: #8b949e; background: none; border: none; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #58a6ff; font-weight: bold; }
        .nav-item span { font-size: 18px; }

        /* Keyframe Animations */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-card">Foydalanuvchi: <span id="username">@User</span></div>
        <div class="coins-container">🪙 <span id="coin-count">0</span></div>
        <div class="energy-box">
            <div class="energy-text">
                <span>⚡ Energiya</span>
                <span><b id="energy-val">1000</b> / <span id="max-energy">1000</span></span>
            </div>
            <div class="energy-bar"><div class="energy-fill" id="energy-bar-fill"></div></div>
        </div>
    </div>

    <!-- 1. MAIN TAP TAB -->
    <div id="tab-tap" class="tab-content active-tab">
        <div class="tap-area">
            <button class="tap-btn" id="tap-btn">TAP!</button>
        </div>
    </div>

    <!-- 2. BOOSTS TAB -->
    <div id="tab-boost" class="tab-content">
        <h2 style="margin-bottom: 15px;">Boosterlar</h2>
        <div class="card-list">
            <div class="card-item">
                <div class="card-info">
                    <h4>Multitap</h4>
                    <p>Har bir tap uchun +1 bonus tanga</p>
                </div>
                <button class="btn-action" onclick="buyBoost('multitap')">1,000 🪙</button>
            </div>
            <div class="card-item">
                <div class="card-info">
                    <h4>Auto-Tap Bot</h4>
                    <p>Siz o'yinda yo'qingizda ham tanga yig'adi</p>
                </div>
                <button class="btn-action" onclick="buyBoost('autotap')">0.5 TON</button>
            </div>
        </div>
    </div>

    <!-- 3. TASKS TAB -->
    <div id="tab-tasks" class="tab-content">
        <h2 style="margin-bottom: 15px;">Vazifalar</h2>
        <div class="card-list">
            <div class="card-item">
                <div class="card-info">
                    <h4>Telegram Kanalga a'zo bo'lish</h4>
                    <p>+5,000 tanga mukofot</p>
                </div>
                <button class="btn-action" onclick="claimTask(1, 5000)">Bajarish</button>
            </div>
        </div>
    </div>

    <!-- 4. REFERRAL TAB -->
    <div id="tab-ref" class="tab-content">
        <h2 style="margin-bottom: 10px;">Referal Tizimi</h2>
        <p style="color:#8b949e; font-size:13px; margin-bottom:20px;">Har bir taklif qilgan do'stingiz uchun <b>5,000 🪙</b> oling!</p>
        <button class="btn-action" style="width: 100%; padding: 14px;" onclick="shareRef()">👥 Do'stlarni Taklif Qilish</button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('tap', this)"><span>🎮</span>O'yin</button>
        <button class="nav-item" onclick="switchTab('boost', this)"><span>🚀</span>Boost</button>
        <button class="nav-item" onclick="switchTab('tasks', this)"><span>📋</span>Vazifalar</button>
        <button class="nav-item" onclick="switchTab('ref', this)"><span>👥</span>Do'stlar</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : 123456789;
        const username = user ? user.username : "User";

        document.getElementById("username").innerText = "@" + username;

        let coins = 0;
        let energy = 1000;
        let maxEnergy = 1000;

        async function loadUserData() {
            try {
                const res = await fetch(`/api/user/${userId}`);
                const data = await res.json();
                if (data.status === 'success') {
                    coins = data.data.coins;
                    energy = data.data.energy;
                    updateUI();
                }
            } catch (e) { console.error("API xatosi:", e); }
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = coins.toLocaleString();
            document.getElementById('energy-val').innerText = energy;
            const percentage = (energy / maxEnergy) * 100;
            document.getElementById('energy-bar-fill').style.width = percentage + "%";
        }

        // Tap va Animatsiya funksiyasi
        const tapBtn = document.getElementById('tap-btn');
        tapBtn.addEventListener('click', (e) => {
            if (energy < 1) return;

            coins += 1;
            energy -= 1;
            updateUI();

            // Telegram Haptic Feedback (Vibratsiya)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Uchib chiquvchi +1 animatsiyasini yaratish
            const rect = tapBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const floatingNum = document.createElement('div');
            floatingNum.className = 'floating-number';
            floatingNum.innerText = '+1';
            floatingNum.style.left = `${x}px`;
            floatingNum.style.top = `${y}px`;

            tapBtn.parentElement.appendChild(floatingNum);

            setTimeout(() => floatingNum.remove(), 800);

            // Backend'ga yuborish
            fetch('/api/tap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, coins_added: 1, energy_used: 1 })
            });
        });

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active-tab');
            element.classList.add('active');
        }

        function shareRef() {
            const botUsername = "CyberProHubBot";
            const refUrl = `https://t.me/share/url?url=https://t.me/${botUsername}?start=ref_${userId}&text=Cyber%20Pro%20Hub%27da%20men%20bilan%20birga%20tanga%20yig%27!`;
            tg.openTelegramLink(refUrl);
        }

        loadUserData();
    </script>
</body>
</html>
