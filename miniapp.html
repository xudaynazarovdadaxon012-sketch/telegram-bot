<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1423;
            --card-bg: #192036;
            --accent-color: #f3ba2f;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden; user-select: none;
            -webkit-user-select: none;
        }
        .header { text-align: center; padding-top: 40px; }
        .balance-container {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: 42px; font-weight: 900; color: var(--accent-color);
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.5);
        }
        .coin-icon { width: 44px; height: 44px; background: var(--accent-color); border-radius: 50%; box-shadow: 0 0 15px var(--accent-color); display: inline-block; }
        
        .clicker-area { position: relative; display: flex; justify-content: center; align-items: center; flex-grow: 1; width: 100%; }
        .coin-btn {
            width: 230px; height: 230px; background: radial-gradient(circle, #fde047 0%, #ca8a04 100%);
            border: 6px solid #fef08a; border-radius: 50%; cursor: pointer;
            box-shadow: 0 20px 40px rgba(202, 138, 4, 0.4), inset 0 5px 15px rgba(255,255,255,0.5);
            display: flex; align-items: center; justify-content: center; font-size: 65px;
            transition: transform 0.05s ease;
        }
        .coin-btn:active { transform: scale(0.92); }
        
        .floating-score {
            position: absolute; font-size: 30px; font-weight: 900; color: #ffffff;
            pointer-events: none; animation: floatUp 0.7s ease-out forwards;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.4); }
        }

        .footer-panel {
            width: 100%; background: var(--card-bg);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 24px; box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
        }
        .energy-info { display: flex; justify-content: space-between; font-size: 15px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 700; }
        .energy-bar-container { width: 100%; background: #111827; height: 16px; border-radius: 8px; overflow: hidden; border: 2px solid #374151; }
        .energy-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-container">
            <span class="coin-icon"></span>
            <span id="score">0</span>
        </div>
    </div>

    <div class="clicker-area" id="clickerArea">
        <div class="coin-btn" id="coinBtn">🪙</div>
    </div>

    <div class="footer-panel">
        <div class="energy-info">
            <span>⚡ Energy</span>
            <span><span id="energy">1000</span> / 1000</span>
        </div>
        <div class="energy-bar-container">
            <div class="energy-bar" id="energyBar"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Telegram ID ni xavfsiz aniqlash
        let userId = "test_user_123";
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
            userId = tg.initDataUnsafe.user.id.toString();
        }

        let score = 0;
        let energy = 1000;
        const maxEnergy = 1000;
        let isSaving = false;
        let needsSave = false;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const energyBarEl = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');

        async function loadUserData() {
            try {
                let response = await fetch(`/get_user?tg_id=${encodeURIComponent(userId)}`);
                if (!response.ok) throw new Error("Network error");
                let data = await response.json();
                score = data.score ?? 0;
                energy = data.energy ?? 1000;
                scoreEl.textContent = score;
                updateEnergyUI();
            } catch (e) {
                console.log("Load error:", e);
            }
        }

        loadUserData();

        async function saveData() {
            if (isSaving) {
                needsSave = true;
                return;
            }
            isSaving = true;
            needsSave = false;

            try {
                await fetch('/update_score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tg_id: userId, score: score, energy: energy })
                });
            } catch (e) {
                console.log("Save error:", e);
            } finally {
                isSaving = false;
                if (needsSave) {
                    saveData();
                }
            }
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 5);
                updateEnergyUI();
                needsSave = true;
            }
        }, 1000);

        setInterval(() => {
            if (needsSave) {
                saveData();
            }
        }, 3000);

        function updateEnergyUI() {
            energyEl.textContent = energy;
            energyBarEl.style.width = (energy / maxEnergy) * 100 + '%';
        }

        coinBtn.addEventListener('pointerdown', (e) => {
            if (energy <= 0) return;

            score += 1;
            energy -= 1;
            scoreEl.textContent = score;
            updateEnergyUI();
            needsSave = true;

            const floating = document.createElement('div');
            floating.className = 'floating-score';
            floating.textContent = '+1';
            floating.style.left = (e.clientX - 25) + 'px';
            floating.style.top = (e.clientY - 45) + 'px';
            document.body.appendChild(floating);
            setTimeout(() => floating.remove(), 700);

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        window.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && needsSave) {
                navigator.sendBeacon('/update_score', JSON.stringify({ tg_id: userId, score: score, energy: energy }));
            }
        });
    </script>
</body>
</html>
