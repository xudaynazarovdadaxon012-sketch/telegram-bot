<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clicker Gold Premium</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome Ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.75);
            --accent-gold: #ffb703;
            --accent-glow: #fb8500;
            --text-main: #ffffff;
            --text-sub: #8e9aaf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1a2332 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Top Bar / Stats */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 18px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .stat-card i {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Main Clicker Section */
        .clicker-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .balance-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .balance-title {
            color: var(--text-sub);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(180deg, #fff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 183, 3, 0.3);
        }

        /* Coin Pulse & Glow Animations */
        .coin-wrapper {
            position: relative;
            cursor: pointer;
        }

        .coin-glow {
            position: absolute;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.4;
            filter: blur(20px);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
        }

        .coin-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffd166, #e67e22);
            border: 8px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 15px 35px rgba(251, 133, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.05s ease;
        }

        .coin-btn:active {
            transform: scale(0.94);
        }

        .coin-btn i {
            font-size: 5rem;
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Floating Flying +1 Floating Effect */
        .floating-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-gold);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        /* Energy Progress Bar */
        .energy-wrapper {
            width: 80%;
            margin-top: 30px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #fb8500, #ffb703);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--accent-gold);
        }

        .nav-item i {
            font-size: 1.3rem;
        }

        /* Shop Modal (Telegram Stars) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: flex-end;
        }

        .modal-content {
            background: #161b26;
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .shop-item {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stars-btn {
            background: linear-gradient(135deg, #0088cc, #00c3ff);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Stats -->
    <div class="header">
        <div class="stat-card">
            <i class="fa-solid fa-bolt"></i>
            <span class="stat-value" id="user-level">Lvl 1</span>
        </div>
        <div class="stat-card">
            <i class="fa-solid fa-trophy"></i>
            <span class="stat-value">Rank #42</span>
        </div>
    </div>

    <!-- Main Clicker Core -->
    <div class="clicker-container">
        <div class="balance-container">
            <div class="balance-title">Umumiy Tangalar</div>
            <div class="balance-amount" id="coin-balance">0</div>
        </div>

        <div class="coin-wrapper" id="coin-btn">
            <div class="coin-glow"></div>
            <div class="coin-btn">
                <i class="fa-solid fa-coins"></i>
            </div>
        </div>

        <!-- Energy Bar -->
        <div class="energy-wrapper">
            <div class="energy-info">
                <span><i class="fa-solid fa-bolt"></i> Energiya</span>
                <span id="energy-text">100 / 100</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energy-fill"></div>
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-hand-pointer"></i>
            <span>Tap</span>
        </div>
        <div class="nav-item" onclick="openShop()">
            <i class="fa-solid fa-store"></i>
            <span>Do'kon</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>Do'stlar</span>
        </div>
    </div>

    <!-- Telegram Stars Shop Modal -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <div style="display:flex; justify-size:space-between; align-items:center; margin-bottom:15px;">
                <h2>Stars Do'koni ⭐️</h2>
                <span style="font-size:1.5rem; cursor:pointer;" onclick="closeShop()">&times;</span>
            </div>
            
            <div class="shop-item">
                <div>
                    <h4>Oltin Lootbox</h4>
                    <p style="font-size:0.8rem; color:var(--text-sub);">Tasodifiy 50,000 tanga yuting</p>
                </div>
                <button class="stars-btn" onclick="buyItem('chest_gold')">
                    <i class="fa-solid fa-star"></i> 50
                </button>
            </div>

            <div class="shop-item">
                <div>
                    <h4>To'liq Energiya</h4>
                    <p style="font-size:0.8rem; color:var(--text-sub);">Energiyani darhol to'ldirish</p>
                </div>
                <button class="stars-btn" onclick="buyItem('energy_full')">
                    <i class="fa-solid fa-star"></i> 25
                </button>
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ekran bo'ylab ochish

        let coins = 0;
        let energy = 100;
        const maxEnergy = 100;

        const coinBalanceEl = document.getElementById('coin-balance');
        const energyTextEl = document.getElementById('energy-text');
        const energyFillEl = document.getElementById('energy-fill');
        const coinBtn = document.getElementById('coin-btn');

        // Clicker Engine
        coinBtn.addEventListener('click', (e) => {
            if (energy <= 0) return;

            coins += 1;
            energy -= 1;

            updateUI();
            createFloatingText(e);

            // VIBRATION (Haptic Feedback) - Qimmati yuqori o'yinlar hissini beradi
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        function updateUI() {
            coinBalanceEl.innerText = coins.toLocaleString();
            energyTextEl.innerText = `${energy} / ${maxEnergy}`;
            energyFillEl.style.width = `${(energy / maxEnergy) * 100}%`;
        }

        function createFloatingText(e) {
            const rect = coinBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = '+1';
            text.style.left = `${x}px`;
            text.style.top = `${y}px`;

            coinBtn.appendChild(text);

            setTimeout(() => text.remove(), 800);
        }

        // Shop Functions
        function openShop() { document.getElementById('shop-modal').style.display = 'flex'; }
        function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }

        async function buyItem(itemType) {
            const userId = tg.initDataUnsafe?.user?.id || 12345;
            
            const response = await fetch('/api/buy-stars-item', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, item_type: itemType })
            });
            
            const resData = await response.json();
            if (resData.status === 'success') {
                tg.openInvoice(resData.invoice_link, (status) => {
                    if (status === 'paid') {
                        tg.showAlert('Xarid muvaffaqiyatli amalga oshirildi! ⭐️');
                        closeShop();
                    }
                });
            }
        }

        // Energiya Tiklanishi (Har 2 sekunda +1 energiya)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                updateUI();
            }
        }, 2000);
    </script>
</body>
</html>
