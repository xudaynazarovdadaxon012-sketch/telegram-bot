<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - 50+ O'yinlar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 16px;
            text-align: center;
        }

        .header {
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.7;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .section-title {
            text-align: left;
            font-size: 16px;
            margin: 16px 0 10px 0;
            color: #38bdf8;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .card:active {
            transform: scale(0.96);
            background: #334155;
        }

        .icon {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .title {
            font-size: 13px;
            font-weight: 600;
        }

        .btn-close {
            margin-top: 24px;
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #0284c7);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 Game Hub Mini App</h1>
        <p>50+ O'yinlar Platformasi</p>
    </div>

    <div class="user-card">
        👤 Foydalanuvchi: <b id="username">Yuklanmoqda...</b>
    </div>

    <div class="section-title">🎮 O'yinlar Katalogi (50 ta O'yin)</div>
    <div class="grid" id="games-container"></div>

    <button class="btn-close" onclick="closeApp()">Yopish</button>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
            } else {
                document.getElementById('username').innerText = "Mehmon";
            }
        } else {
            document.getElementById('username').innerText = "Brauzer Rejimi";
        }

        // 50 ta O'yinlar ro'yxati
        const gameList = [
            { name: "Slots Casino", icon: "🎰" },
            { name: "Dice Roll", icon: "🎲" },
            { name: "Darts Master", icon: "🎯" },
            { name: "Brain Quiz", icon: "🧠" },
            { name: "Football Penalty", icon: "⚽️" },
            { name: "Basketball Star", icon: "🏀" },
            { name: "Speed Racing", icon: "🏎" },
            { name: "Block Puzzle", icon: "🧩" },
            { name: "Retro Arcade", icon: "🎮" },
            { name: "Bowling Strike", icon: "🎳" },
            { name: "Tic Tac Toe", icon: "❌" },
            { name: "Chess Pro", icon: "♟" },
            { name: "Checkers", icon: "⚪️" },
            { name: "Snake Classic", icon: "🐍" },
            { name: "Tetris Mania", icon: "🧱" },
            { name: "Ping Pong", icon: "🏓" },
            { name: "Billiards 8-Ball", icon: "🎱" },
            { name: "Archery King", icon: "🏹" },
            { name: "Boxing Champion", icon: "🥊" },
            { name: "Tennis Clash", icon: "🎾" },
            { name: "Golf Master", icon: "⛳️" },
            { name: "Flappy Bird", icon: "🐤" },
            { name: "Pacman", icon: "🟡" },
            { name: "Space Invaders", icon: "👾" },
            { name: "Subway Runner", icon: "🏃" },
            { name: "Fruit Ninja", icon: "🍉" },
            { name: "Angry Birds", icon: "🐦" },
            { name: "Hill Climb", icon: "🚗" },
            { name: "Temple Run", icon: "🗿" },
            { name: "2048 Puzzle", icon: "🔢" },
            { name: "Sudoku Expert", icon: "📝" },
            { name: "Crossword", icon: "🔤" },
            { name: "Memory Card", icon: "🃏" },
            { name: "Minesweeper", icon: "💣" },
            { name: "Solitaire Classic", icon: "🎴" },
            { name: "Poker Texas", icon: "♦️" },
            { name: "Blackjack 21", icon: "♠️" },
            { name: "Roulette Wheel", icon: "🎡" },
            { name: "Ludo King", icon: "🎲" },
            { name: "Dominoes", icon: "🀄️" },
            { name: "Air Hockey", icon: "🏒" },
            { name: "Badminton", icon: "🏸" },
            { name: "Ski Adventure", icon: "🎿" },
            { name: "Surfing Dash", icon: "🏄" },
            { name: "Skate Park", icon: "🛹" },
            { name: "Moto Cross", icon: "🏍" },
            { name: "Tank Battle", icon: "🚜" },
            { name: "Galaxy War", icon: "🚀" },
            { name: "Zombie Hunt", icon: "🧟" },
            { name: "Ninja Slice", icon: "⚔️" }
        ];

        const container = document.getElementById('games-container');

        gameList.forEach((game, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => alert(`${index + 1}. ${game.name} o'yini tez orada ishga tushiriladi!`);
            card.innerHTML = `
                <div class="icon">${game.icon}</div>
                <div class="title">${game.name}</div>
            `;
            container.appendChild(card);
        });

        function closeApp() {
            if (tg) {
                tg.close();
            } else {
                window.close();
            }
        }
    </script>
</body>
</html>
