<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Empire Pro 3D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(21, 29, 42, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #ffb703;
            --accent-glow: rgba(255, 183, 3, 0.4);
            --purple: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.5);
            --green: #10b981;
            --text: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
            user-select: none; -webkit-user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Neon Glows */
        .glow-1 {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(40px);
        }
        .glow-2 {
            position: absolute; bottom: 50px; left: -50px;
            width: 250px; height: 250px; background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(50px);
        }

        /* Background Particle Canvas */
        #particleCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .header {
            position: relative; z-index: 2; text-align: center; padding: 15px 15px 10px;
            background: var(--card-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
        }

        .balance-box {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 38px; font-weight: 900; color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow); transition: transform 0.1s;
        }

        .live-feed {
            position: relative; z-index: 2; font-size: 11px; color: var(--green);
            text-align: center; padding: 6px 12px; background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 20px;
            margin: 10px 20px 0; backdrop-filter: blur(10px);
            animation: pulseFeed 2s infinite ease-in-out;
        }
        @keyframes pulseFeed {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; transform: scale(1.01); }
        }

        .nav-tabs {
            position: relative; z-index: 2; display: flex; justify-content: space-around;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px);
            padding: 8px 10px; border-bottom: 1px solid var(--card-border);
        }
        .tab-btn {
            background: none; border: none; color: #94a3b8; font-size: 13px;
            font-weight: 700; cursor: pointer; padding: 8px 14px; border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active {
            color: #fff; background: linear-gradient(135deg, rgba(255,183,3,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tab-content {
            position: relative; z-index: 2; display: none; flex-direction: column;
            align-items: center; justify-content: center; flex-grow: 1; padding: 20px;
        }
        .tab-content.active { display: flex; }

        /* 3D TAP ZONE */
        .coin-wrapper { position: relative; perspective: 1000px; }
        .coin {
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffe169 0%, #ffb703 50%, #d97706 100%);
            display: flex; align-items: center; justify-content: center; font-size: 90px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 50px var(--accent-glow), inset 0 6px 15px rgba(255,255,255,0.8), inset 0 -6px 15px rgba(0,0,0,0.4);
            cursor: pointer; transform-style: preserve-3d;
            transition: transform 0.08s ease-out;
        }
        .coin:active { transform: scale(0.93) rotateX(10deg) rotateY(-10deg); }

        /* Floating Number FX (+1, +2) */
        .floating-num {
            position: absolute; color: #fff; font-weight: 900; font-size: 28px;
            pointer-events: none; z-index: 99; text-shadow: 0 0 10px var(--accent-glow);
            animation: floatUp 0.8s forwards ease-out;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
        }

        /* PRO CS ROULETTE */
        .case-wrapper {
            width: 100%; max-width: 330px; height: 115px; background: rgba(5, 7, 12, 0.9);
            border: 2px solid var(--purple); border-radius: 16px; position: relative;
            overflow: hidden; box-shadow: 0 0 30px var(--purple-glow);
        }
        .pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%; background: #f43f5e; z-index: 10;
            box-shadow: 0 0 12px #f43f5e;
        }
        .roulette-track {
            display: flex; position: absolute; left: 0; top: 12px; height: 90px;
            transition: transform 4s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .roulette-item {
            min-width: 90px; height: 90px; margin: 0 6px; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: 14px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            font-weight: 800; font-size: 16px; color: var(--accent);
            backdrop-filter: blur(10px); box-shadow: inset 0 0 15px rgba(255,255,255,0.03);
        }

        .action-btn {
            margin-top: 22px; padding: 15px 40px;
            background: linear-gradient(135deg, var(--purple) 0%, #6366f1 100%);
            border: none; border-radius: 14px; color: white; font-weight: 900; font-size: 17px;
            cursor: pointer; box-shadow: 0 6px 25px var(--purple-glow); width: 100%; max-width: 290px;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .action-btn:active { transform: scale(0.96); }

        /* GLASSMORPHIC STORE & FRIENDS */
        .glass-card {
            width: 100%; max-width: 330px; background: var(--card-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 16px; border-radius: 16px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--card-border); box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .buy-btn {
            background: linear-gradient(135deg, #ffb703, #fb8500); border: none;
            padding: 10px 18px; border-radius: 10px; font-weight: 900; color: #000;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255,183,3,0.3);
        }

        .footer {
            position: relative; z-index: 2; padding: 16px 20px;
            background: var(--card-bg); backdrop-filter: blur(15px);
            border-top: 1px solid var(--card-border);
        }
        .progress-bar {
            width: 100%; background: rgba(255,255,255,0.05); height: 12px;
            border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
        }
        .progress-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ffb703, #10b981);
            box-shadow: 0 0 12px var(--accent-glow); transition: width 0.15s linear;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="header">
        <div class="balance-box" id="balanceBox">🪙 <span id="score">0</span></div>
    </div>

    <div class="live-feed" id="liveFeed">🔥 @alex_crypto just won +1,000 🪙!</div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tap')">⚡ Tap</button>
        <button class="tab-btn" onclick="switchTab('case')">📦 Cases</button>
        <button class="tab-btn" onclick="switchTab('store')">🛒 Store</button>
        <button class="tab-btn" onclick="switchTab('ref')">👥 Friends</button>
    </div>

    <!-- TAP TAB -->
    <div id="tap" class="tab-content active">
        <div class="coin-wrapper">
            <div class="coin" id="coinBtn">🪙</div>
        </div>
    </div>

    <!-- CASES TAB -->
    <div id="case" class="tab-content">
        <div class="case-wrapper">
            <div class="pointer"></div>
            <div class="roulette-track" id="track"></div>
        </div>
        <button class="action-btn" onclick="openCase()">Open Case (300 🪙)</button>
        <div id="caseResult" style="margin-top: 15px; font-weight: 900; font-size: 18px; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow);"></div>
    </div>

    <!-- STORE TAB -->
    <div id="store" class="tab-content">
        <div class="glass-card">
            <div>
                <div><b>Multi-Tap</b></div>
                <small style="color: #94a3b8;">Level: <span id="tapLvl">1</span> (+1 per tap)</small>
            </div>
            <button class="buy-btn" id="tapCostBtn" onclick="buyUpgrade('tap')">200 🪙</button>
        </div>
        <div class="glass-card">
            <div>
                <div><b>Energy Limit</b></div>
                <small style="color: #94a3b8;">+500 Capacity</small>
            </div>
            <button class="buy-btn" id="energyCostBtn" onclick="buyUpgrade('energy')">300 🪙</button>
        </div>
    </div>

    <!-- FRIENDS TAB -->
    <div id="tab-ref" class="tab-content">
        <h3 style="margin-top:0;">Invite Friends</h3>
        <p style="text-align: center; color: #94a3b8; font-size: 14px;">Get +1,000 🪙 for each invited friend!</p>
        <button class="action-btn" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 25px rgba(16,185,129,0.4);" onclick="copyInvite()">Copy Invite Link</button>
    </div>

    <div class="footer">
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 800; font-size: 13px;">
            <span>⚡ Energy</span>
            <span><span id="energy">1000</span> / <span id="maxEnergy">1000</span></span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="energyFill"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if(tg) { tg.expand(); tg.ready(); }
        let userId = tg?.initDataUnsafe?.user?.id?.toString() || "demo_user";

        let score = 1000, energy = 1000, maxEnergy = 1000, tapLevel = 1;
        let isSpinning = false;

        /* Canvas Background Particles */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for(let i=0; i<30; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speed;
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        async function loadData() {
            try {
                let res = await fetch(`/get_user?tg_id=${userId}`);
                let data = await res.json();
                score = data.score;
                energy = data.energy;
                maxEnergy = data.max_energy;
                tapLevel = data.tap_level;
                updateUI();
            } catch(e){}
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energy').innerText = energy;
            document.getElementById('maxEnergy').innerText = maxEnergy;
            document.getElementById('energyFill').style.width = (energy / maxEnergy * 100) + '%';
            document.getElementById('tapLvl').innerText = tapLevel;
            document.getElementById('tapCostBtn').innerText = (tapLevel * 200) + ' 🪙';
        }

        /* Tap & Floating Effect */
        document.getElementById('coinBtn').addEventListener('pointerdown', (e) => {
            if (energy >= tapLevel) {
                score += tapLevel;
                energy -= tapLevel;
                updateUI();
                saveData();

                // Create Floating Number
                let floatNum = document.createElement('div');
                floatNum.className = 'floating-num';
                floatNum.innerText = '+' + tapLevel;
                floatNum.style.left = (e.clientX - 15) + 'px';
                floatNum.style.top = (e.clientY - 30) + 'px';
                document.body.appendChild(floatNum);
                setTimeout(() => floatNum.remove(), 800);

                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }
        });

        /* CS Roulette logic */
        const items = [50, 100, 200, 500, 1000, 5000];
        function generateTrack() {
            const track = document.getElementById('track');
            track.innerHTML = '';
            for(let i=0; i<40; i++) {
                let val = items[Math.floor(Math.random() * items.length)];
                let div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerText = '+' + val;
                track.appendChild(div);
            }
        }
        generateTrack();

        async function openCase() {
            if (isSpinning) return;
            if (score < 300) { alert("Mablag' yetarli emas!"); return; }

            isSpinning = true;
            document.getElementById('caseResult').innerText = '';

            let res = await fetch('/open_case', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tg_id: userId})
            });
            let data = await res.json();

            if (res.ok) {
                score = data.new_score;
                const track = document.getElementById('track');
                track.style.transition = 'none';
                track.style.transform = 'translateX(0px)';
                
                setTimeout(() => {
                    track.style.transition = 'transform 4s cubic-bezier(0.1, 1, 0.1, 1)';
                    track.style.transform = `translateX(-${2700 + Math.random() * 80}px)`;
                }, 50);

                setTimeout(() => {
                    document.getElementById('caseResult').innerText = `🎉 WIN: +${data.win} 🪙!`;
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    updateUI();
                    isSpinning = false;
                    generateTrack();
                }, 4100);
            } else {
                alert(data.error);
                isSpinning = false;
            }
        }

        async function buyUpgrade(type) {
            let res = await fetch('/buy_upgrade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tg_id: userId, type: type})
            });
            if (res.ok) {
                let data = await res.json();
                score = data.score;
                energy = data.energy;
                maxEnergy = data.max_energy;
                tapLevel = data.tap_level;
                updateUI();
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function copyInvite() {
    // YOUR_BOT_USERNAME o'rniga o'zingizning real botingiz usernamesini yozing (masalan: MyCrypto_bot)
    let botUsername = "@kunlik_vazifalar_2026_bot"; 
    let link = `https://t.me/${botUsername}?start=${userId}`;
    
    navigator.clipboard.writeText(link);
    alert("Referral link copied!");
}

        async function saveData() {
            await fetch('/update_data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    tg_id: userId, score: score, energy: energy, tap_level: tapLevel, max_energy: maxEnergy
                })
            });
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            let target = name === 'ref' ? 'tab-ref' : name;
            document.getElementById(target).classList.add('active');
            event.target.classList.add('active');
        }

        const fakeUsers = ['@alex_crypto', '@dev_john', '@crypto_king', '@sam_web3', '@lisa_tg'];
        const fakePrizes = [200, 500, 1000, 2500];
        setInterval(() => {
            let u = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
            let p = fakePrizes[Math.floor(Math.random() * fakePrizes.length)];
            document.getElementById('liveFeed').innerText = `🔥 ${u} just won +${p} 🪙!`;
        }, 4000);

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 4);
                updateUI();
            }
        }, 1000);

        loadData();
    </script>
</body>
</html>
