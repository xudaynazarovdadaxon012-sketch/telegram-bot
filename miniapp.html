<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .gold-text { color: #f39c12; font-weight: bold; }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .case-card {
            background: #0f3460;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #e94560;
        }
        .admin-panel { display: none; border: 1px dashed #f39c12; }
    </style>
</head>
<body>

    <h2>🏆 Clicker Gold</h2>
    
    <div class="card">
        <h3>Balans: <span id="balance" class="gold-text">0</span> Tanga</h3>
        <p>Energiya: <span id="energy">1000</span>/1000</p>
    </div>

    <!-- Referal bo'limi -->
    <div class="card">
        🎯 <b>Do'st taklif qilish</b>
        <p style="font-size: 12px;">Har 1 taklif uchun <b>100 tanga</b> oling!</p>
        <button onclick="copyRefLink()">Havolani nusxalash</button>
    </div>

    <!-- Omadli g'ildirak -->
    <div class="card">
        🎡 <b>Omadli G'ildirak</b>
        <br>
        <button onclick="spinWheel('coin')">Tangaga aylantirish</button>
        <button onclick="spinWheel('stars')" style="background:#f1c40f; color:#000;">⭐ 1 Stars bilan</button>
        <div id="wheel-result" class="gold-text" style="margin-top:8px;"></div>
    </div>

    <!-- CS:GO Drop Qutilar -->
    <div class="card">
        📦 <b>CS:GO Drop Qutilar</b>
        <div class="cases-grid" style="margin-top:10px;">
            <div class="case-card">
                <b>🥉 Bronza</b><br><small>500 tanga</small><br>
                <button onclick="openCase('bronze')">Ochish</button>
            </div>
            <div class="case-card">
                <b>🥈 Kumush</b><br><small>2000 tanga</small><br>
                <button onclick="openCase('silver')">Ochish</button>
            </div>
            <div class="case-card">
                <b>🥇 Oltin</b><br><small>⭐ 1 Stars</small><br>
                <button onclick="openCase('gold')">Ochish</button>
            </div>
            <div class="case-card">
                <b>💎 Afsonaviy</b><br><small>⭐ 5 Stars</small><br>
                <button onclick="openCase('legendary')">Ochish</button>
            </div>
        </div>
        <div id="case-result" class="gold-text" style="margin-top:10px;"></div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-section" class="card admin-panel">
        👑 <b>Admin Panel</b>
        <br><br>
        <input type="text" id="chan-input" placeholder="@kanal_username" style="padding: 8px; border-radius: 5px; border: none;">
        <button onclick="addChannel()">Kanal qo'shish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user || { id: 123456789, username: "TestUser" };
        const startParam = tg.initDataUnsafe.start_param || null;
        let refLink = "";

        // Boshlang'ich ma'lumotlarni yuklash
        fetch('/api/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: user.id, username: user.username, ref_id: startParam })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('balance').innerText = data.balance;
                document.getElementById('energy').innerText = data.energy;
                refLink = data.ref_link;
                if(data.is_admin) {
                    document.getElementById('admin-section').style.display = 'block';
                }
            }
        });

        function copyRefLink() {
            navigator.clipboard.writeText(refLink);
            alert("Referal havola nusxalandi!");
        }

        function spinWheel(type) {
            fetch('/api/spin_wheel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: user.id, spin_type: type })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('wheel-result').innerText = "Tushdi: " + data.prize.name;
                    document.getElementById('balance').innerText = data.new_balance;
                }
            });
        }

        function openCase(type) {
            fetch('/api/open_case', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: user.id, case_type: type })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('case-result').innerText = "Yutdingiz: " + data.reward.name;
                    document.getElementById('balance').innerText = data.new_balance;
                } else {
                    alert(data.message);
                }
            });
        }

        function addChannel() {
            const ch = document.getElementById('chan-input').value;
            fetch('/api/admin/add_channel', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: user.id, channel_username: ch })
            })
            .then(res => res.json())
            .then(data => alert(data.message));
        }
    </script>
</body>
</html>
