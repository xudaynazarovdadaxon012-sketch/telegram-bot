<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(23, 32, 51, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00f2fe;
            --purple: #7928ca;
            --gold: #ff0080;
            --yellow: #f59e0b;
            --text: #ffffff;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.15), transparent 70%);
            color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none;
        }
        .header { padding: 15px; background: var(--card); border-bottom: 1px solid var(--border); text-align: center; }
        .user-info { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
        .balance { font-size: 28px; font-weight: 900; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .league { display: inline-block; font-size: 10px; font-weight: 800; background: linear-gradient(135deg, var(--gold), var(--purple)); padding: 3px 10px; border-radius: 12px; margin-top: 4px; }

        .tabs { display: flex; background: rgba(11, 15, 25, 0.95); border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px 6px; background: none; border: none; color: var(--text-sub); font-size: 10px; font-weight: 800; cursor: pointer; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--accent); }

        .content { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; overflow-y: auto; }
        .content.active { display: flex; }

        .coin-box { position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        .coin { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #00f2fe, #4facfe, #7928ca); box-shadow: 0 0 35px rgba(0, 242, 254, 0.4); display: flex; align-items: center; justify-content: center; font-size: 65px; cursor: pointer; }
        .coin:active { transform: scale(0.92); }

        .card { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent), #4facfe); border: none; border-radius: 10px; color: #000; font-weight: 900; cursor: pointer; font-size: 13px; margin-top: 8px; }
        .btn-purple { background: linear-gradient(135deg, var(--purple), var(--gold)); color: #fff; }
        .input { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: #fff; text-align: center; margin: 8px 0; outline: none; }

        .footer { padding: 12px 20px; background: var(--card); border-top: 1px solid var(--border); }
        .energy-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 4px; }
        .energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); transition: width 0.2s; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">Foydalanuvchi: <b id="uName" style="color:#fff;">O'yinchi</b></div>
        <div class="balance">🪙 <span id="score">0</span></div>
        <div class="league" id="leagueBadge">Bronze League</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('tap', event)">⚡ TAP</button>
        <button class="tab-btn" onclick="setTab('spin', event)">🎰 G'ILDIRAK</button>
        <button class="tab-btn" onclick="setTab('quiz', event)">🧠 TOPISHMOQ</button>
        <button class="tab-btn" onclick="setTab('ref', event)">👥 DO'STLAR</button>
    </div>

    <!-- TAP -->
    <div id="tap" class="content active">
        <div class="coin-box">
            <div class="coin" id="tapBtn">🪙</div>
        </div>
        <div style="font-size: 12px; color: var(--text-sub);">Har bosish: <b style="color:var(--accent);">+<span id="powerText">1</span> Coin</b></div>
    </div>

    <!-- SPIN -->
    <div id="spin" class="content">
        <div class="card">
            <h3 style="color:var(--yellow); font-size: 15px; margin-bottom: 8px;">🎰 Omadli G'ildirak</h3>
            <div style="position: relative; width: 180px; height: 180px; margin: 10px auto;">
                <div id="wheel" style="position: relative; width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--accent); background: conic-gradient(#ff0080 0deg 60deg, #7928ca 60deg 120deg, #00f2fe 120deg 180deg, #f59e0b 180deg 240deg, #10b981 240deg 300deg, #ef4444 300deg 360deg); transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1); overflow: hidden;">
                    <span style="position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: #fff;">1000</span>
                    <span style="position: absolute; top: 45px; right: 20px; font-size: 11px; font-weight: 900; color: #fff;">500</span>
                    <span style="position: absolute; bottom: 45px; right: 20px; font-size: 11px; font-weight: 900; color: #fff;">300</span>
                    <span style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 900; color: #fff;">150</span>
                    <span style="position: absolute; bottom: 45px; left: 20px; font-size: 11px; font-weight: 900; color: #fff;">50</span>
                    <span style="position: absolute; top: 45px; left: 20px; font-size: 11px; font-weight: 900; color: #fff;">0</span>
                </div>
                <div style="position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 15px solid #fff; z-index: 5;"></div>
            </div>
            <p style="font-size: 11px; color: var(--text-sub);">Aylantirish: <b>200 Coin</b></p>
            <div id="spinRes" style="font-size: 15px; font-weight: 900; margin: 8px 0; color: var(--accent);">🎁 Omadni sinab ko'ring!</div>
            <button class="btn btn-purple" onclick="spinGame()">Aylantirish</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="content">
        <div class="card">
            <h4 style="font-size: 11px; color: var(--accent); margin-bottom: 6px;">TOPISHMOQ N°<span id="qNum">1</span></h4>
            <p id="qText" style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">Yuklanmoqda...</p>
            <input type="text" id="ansInput" class="input" placeholder="Javobingiz...">
            <button class="btn" onclick="checkAnswer()">Tekshirish</button>
        </div>
    </div>

    <!-- REFERRAL -->
    <div id="ref" class="content">
        <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 6px;">👥 Do'stlarni taklif qiling</h3>
            <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 10px;">Har bir do'st uchun: <b style="color:var(--accent);">+1,000 Coin</b></p>
            <input type="text" id="refLink" class="input" readonly value="https://t.me/BotUsername?start=">
            <button class="btn btn-purple" onclick="copyRef()">Nusxalash</button>
        </div>
    </div>

    <div class="footer">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700;">
            <span>⚡ Energiya</span>
            <span><span id="energy">100</span> / 100</span>
        </div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api"; // Python backend manzili
        let tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let AppState = {
            userId: tg?.initDataUnsafe?.user?.id || 123456,
            username: tg?.initDataUnsafe?.user?.first_name || "O'yinchi",
            score: 0, energy: 100, tapPower: 1, quizIndex: 0
        };

        const quizData = [
            { q: "Suvga tushsa ham ho'l bo'lmaydigan narsa?", a: "soya" },
            { q: "Narsa qanchalik ko'p olinsa, shunchalik kattalashadi?", a: "o'ra" }
        ];

        document.getElementById('uName').innerText = AppState.username;
        document.getElementById('refLink').value = "https://t.me/BotUsername?start=" + AppState.userId;

        // SERVER BILAN SINXRONIZATSIYA (FETCH)
        async function syncData() {
            try {
                let res = await fetch(`${API_URL}/sync`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: AppState.userId, username: AppState.username })
                });
                let data = await res.json();
                if(data.success) {
                    AppState.score = data.user.score;
                    AppState.energy = data.user.energy;
                    AppState.tapPower = data.user.tapPower;
                    updateUI();
                }
            } catch(e) { updateUI(); }
        }

        function updateUI() {
            document.getElementById('score').innerText = AppState.score.toLocaleString();
            document.getElementById('energy').innerText = AppState.energy;
            document.getElementById('powerText').innerText = AppState.tapPower;
            document.getElementById('energyFill').style.width = (AppState.energy) + '%';
        }

        // TAP
        document.getElementById('tapBtn').addEventListener('click', async () => {
            if(AppState.energy >= 1) {
                AppState.score += AppState.tapPower;
                AppState.energy -= 1;
                updateUI();
                try {
                    await fetch(`${API_URL}/tap`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ userId: AppState.userId })
                    });
                } catch(e){}
            }
        });

        // SPIN LOGIC
        let currentRotation = 0;
        function spinGame() {
            if(AppState.score < 200) return alert("Kamida 200 Coin kerak!");
            AppState.score -= 200; updateUI();

            let prizes = [0, 50, 150, 300, 500, 1000];
            let randomIndex = Math.floor(Math.random() * prizes.length);
            let win = prizes[randomIndex];

            let degPerSlice = 360 / prizes.length;
            let targetDegree = (prizes.length - randomIndex) * degPerSlice - (degPerSlice / 2);
            currentRotation += 1800 + targetDegree;

            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                AppState.score += win; updateUI();
                document.getElementById('spinRes').innerText = win > 0 ? `🎉 Yutug'ingiz: +${win} Coin!` : "😢 0 Coin tushdi";
            }, 3000);
        }

        function loadQuiz() {
            let item = quizData[AppState.quizIndex % quizData.length];
            document.getElementById('qNum').innerText = (AppState.quizIndex + 1);
            document.getElementById('qText').innerText = item.q;
        }

        function checkAnswer() {
            let ans = document.getElementById('ansInput').value.trim().toLowerCase();
            let item = quizData[AppState.quizIndex % quizData.length];
            if(ans === item.a) {
                AppState.score += 150; AppState.quizIndex++; updateUI(); loadQuiz(); alert("To'g'ri! +150 Coin");
            } else alert("Noto'g'ri!");
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('refLink').value);
            alert("Nusxalandi!");
        }

        function setTab(name, e) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            e.currentTarget.classList.add('active');
            if(name === 'quiz') loadQuiz();
        }

        syncData();
    </script>
</body>
</html>
