<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega App & Sky Jumper 3D</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Plus Jakarta Sans', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0c101c; color: #fff; }
    
    /* App Views */
    .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .view.active { display: flex; flex-direction: column; }
    
    /* Header */
    .app-header { background: #141a2e; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .app-title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: #00e676; }
    .btn-game-launch { background: linear-gradient(135deg, #00e676, #00b0ff); color: #050b14; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 800; cursor: pointer; }

    /* Hub Grid */
    .hub-container { flex: 1; padding: 16px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
    .hub-card { background: #151c33; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; gap: 8px; transition: 0.2s; }
    .hub-card:active { transform: scale(0.95); background: #1d2645; }
    .hub-icon { font-size: 26px; }
    .hub-label { font-size: 11px; font-weight: 700; color: #d0d7f0; }

    /* Tool Modal Views */
    .tool-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .btn-back { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; width: fit-content; }
    input, textarea, select { width: 100%; background: #182038; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px; color: #fff; outline: none; font-size: 14px; }
    .btn-action { background: #00e676; color: #050b14; border: none; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; }
    .output-box { background: #101626; border: 1px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 14px; min-height: 80px; font-size: 13px; color: #a0aec0; word-break: break-all; }

    /* 3D Game Layer */
    #webgl-container { width: 100%; height: 100%; }
    .game-hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
    .hud-box { background: rgba(15,22,42,0.85); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); font-weight: 800; font-size: 14px; }
    .game-ctrl { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 24px; z-index: 10; }
    .btn-ctrl { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); display: flex; justify-content: center; align-items: center; font-size: 24px; }
  </style>
</head>
<body>

  <!-- MAIN HUB VIEW -->
  <div id="view-hub" class="view active">
    <div class="app-header">
      <div class="app-title">MEGA HUB</div>
      <button class="btn-game-launch" onclick="openGame()">🎮 SKY JUMPER 3D</button>
    </div>
    <div class="hub-container">
      <div class="hub-card" onclick="openTool('ai-chat')"><div class="hub-icon">🤖</div><div class="hub-label">AI Chat</div></div>
      <div class="hub-card" onclick="openTool('ai-rasm')"><div class="hub-icon">🎨</div><div class="hub-label">AI Rasm</div></div>
      <div class="hub-card" onclick="openTool('media-dl')"><div class="hub-icon">📥</div><div class="hub-label">Media Downloader</div></div>
      <div class="hub-card" onclick="openTool('kripto')"><div class="hub-icon">📈</div><div class="hub-label">Kripto Kursi</div></div>
      <div class="hub-card" onclick="openTool('link-short')"><div class="hub-icon">🔗</div><div class="hub-label">Link Qisqartirish</div></div>
      <div class="hub-card" onclick="openTool('tarjimon')"><div class="hub-icon">🌐</div><div class="hub-label">Tarjimon</div></div>
      <div class="hub-card" onclick="openTool('qr-gen')"><div class="hub-icon">📱</div><div class="hub-label">QR Yaratish</div></div>
      <div class="hub-card" onclick="openTool('calc')"><div class="hub-icon">🧮</div><div class="hub-label">Kalkulyator</div></div>
      <div class="hub-card" onclick="openTool('ob-havo')"><div class="hub-icon">🌤️</div><div class="hub-label">Ob-havo</div></div>
      <div class="hub-card" onclick="openTool('valyuta')"><div class="hub-icon">💵</div><div class="hub-label">Valyuta Kursi</div></div>
      <div class="hub-card" onclick="openTool('eslatma')"><div class="hub-icon">📝</div><div class="hub-label">Eslatmalar</div></div>
      <div class="hub-card" onclick="openTool('admin')"><div class="hub-icon">⚙️</div><div class="hub-label">Admin Panel</div></div>
    </div>
  </div>

  <!-- GENERIC TOOL VIEW TEMPLATE -->
  <div id="view-tool" class="view">
    <div class="app-header">
      <button class="btn-back" onclick="showHub()">◄ Orqaga</button>
      <div class="app-title" id="tool-title" style="font-size:14px;">XIZMAT</div>
    </div>
    <div class="tool-body" id="tool-content"></div>
  </div>

  <!-- GAME VIEW -->
  <div id="view-game" class="view">
    <div class="game-hud">
      <div class="hud-box" style="color:#00e676;" id="g-score">0m</div>
      <button class="btn-back" onclick="showHub()" style="pointer-events:auto;">✕ Chiqish</button>
      <div class="hud-box" style="color:#ffd700;" id="g-coins">🪙 0</div>
    </div>
    <div class="game-ctrl">
      <div class="btn-ctrl" id="g-left">◄</div>
      <div class="btn-ctrl" id="g-right">►</div>
    </div>
    <div id="webgl-container"></div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); tg.ready(); }

    function showHub() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-hub').classList.add('active');
    }

    function openGame() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-game').classList.add('active');
      init3DGame();
    }

    // --- TOOL ROUTER ---
    function openTool(type) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-tool').classList.add('active');
      const title = document.getElementById('tool-title');
      const content = document.getElementById('tool-content');

      const tools = {
        'ai-chat': { t: 'AI CHAT', c: '<textarea placeholder="Savolingizni yozing..."></textarea><button class="btn-action" onclick="runSim(this)">YUBORISH</button><div class="output-box">AI Javobi shu yerda chiqadi...</div>' },
        'ai-rasm': { t: 'AI RASM YARATISH', c: '<input placeholder="Rasm tavsifi (Prompt)..."><button class="btn-action" onclick="runSim(this)">GENERATSIYA QILISH</button><div class="output-box">Rasm havola ko\'rinishida tayyorlanadi...</div>' },
        'media-dl': { t: 'MEDIA DOWNLOADER', c: '<input placeholder="Instagram/TikTok/YouTube link..."><button class="btn-action" onclick="runSim(this)">YUKLASH</button><div class="output-box">Media fayl tayyor...</div>' },
        'kripto': { t: 'KRIPTO KURSI', c: '<div class="output-box"><b>BTC:</b> $64,200<br><b>ETH:</b> $3,450<br><b>TON:</b> $6.80</div>' },
        'link-short': { t: 'LINK QISQARTIRISH', c: '<input placeholder="Uzun linkni kiriting..."><button class="btn-action" onclick="runSim(this)">QISQARTIRISH</button><div class="output-box">https://clck.ru/sample</div>' },
        'tarjimon': { t: 'TARJIMON', c: '<textarea placeholder="Matn kiriting..."></textarea><button class="btn-action" onclick="runSim(this)">TARJIMA QILISH</button><div class="output-box">Tarjima natijasi...</div>' },
        'qr-gen': { t: 'QR YARATISH', c: '<input placeholder="Matn yoki Link..."><button class="btn-action" onclick="runSim(this)">QR HOZIRLASH</button><div class="output-box">QR Code kodi yaratildi.</div>' },
        'calc': { t: 'KALKULYATOR', c: '<input id="calc-in" placeholder="12+45*2"><button class="btn-action" onclick="calcEval()">HISOBLASH</button><div class="output-box" id="calc-out">Natija: 0</div>' },
        'ob-havo': { t: 'OB-HAVO', c: '<input placeholder="Shahar nomi..."><button class="btn-action" onclick="runSim(this)">IZLASH</button><div class="output-box">Toshkent: +28°C, Mūsayiqlik</div>' },
        'valyuta': { t: 'VALYUTA KURSI', c: '<div class="output-box"><b>1 USD:</b> 12,650 UZS<br><b>1 EUR:</b> 13,800 UZS<br><b>1 RUB:</b> 142 UZS</div>' },
        'eslatma': { t: 'ESLATMALAR', c: '<input placeholder="Eslatmat matni..."><button class="btn-action" onclick="runSim(this)">SAQLASH</button><div class="output-box">1. Loyihani sotuvga chiqarish.</div>' },
        'admin': { t: 'ADMIN PANEL', c: '<div class="output-box"><b>Foydalanuvchilar:</b> 1,240 ta<br><b>Bugungi aktivlik:</b> 310<br><b>Tizim holati:</b> 100% OK</div>' }
      };

      if (tools[type]) {
        title.innerText = tools[type].t;
        content.innerHTML = tools[type].c;
      }
    }

    function runSim(btn) {
      const out = btn.nextElementSibling;
      out.innerText = "Bajarilmoqda...";
      setTimeout(() => { out.innerText = "Muvaffaqiyatli bajarildi (Demo Mode)"; }, 600);
    }

    function calcEval() {
      try {
        const val = document.getElementById('calc-in').value;
        document.getElementById('calc-out').innerText = "Natija: " + eval(val);
      } catch(e) { document.getElementById('calc-out').innerText = "Xato!"; }
    }

    // --- 3D GAME ENGINE ---
    let gameInited = false;
    let scene, camera, renderer, player, platforms = [];
    let score = 0, coins = 0, jumpVel = 0, isPlaying = false;
    let moveLeft = false, moveRight = false;

    function init3DGame() {
      if (gameInited) { resetGame(); return; }
      gameInited = true;

      const container = document.getElementById('webgl-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c101c);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const light = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(light);

      const pGeo = new THREE.SphereGeometry(0.6, 24, 24);
      const pMat = new THREE.MeshBasicMaterial({ color: 0x00e676 });
      player = new THREE.Mesh(pGeo, pMat);
      scene.add(player);

      resetGame();
      setupControls();
      animate();
    }

    function resetGame() {
      score = 0; coins = 0; jumpVel = 0.35; isPlaying = true;
      document.getElementById('g-score').innerText = '0m';
      document.getElementById('g-coins').innerText = '🪙 0';

      platforms.forEach(p => scene.remove(p));
      platforms = [];

      const platGeo = new THREE.BoxGeometry(3, 0.4, 3);
      const platMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });

      for(let i = 0; i < 20; i++) {
        const plat = new THREE.Mesh(platGeo, platMat);
        plat.position.set((Math.random() - 0.5) * 6, i * 3.2, 0);
        scene.add(plat);
        platforms.push(plat);
      }
      player.position.set(platforms[0].position.x, 1.5, 0);
    }

    function setupControls() {
      const l = document.getElementById('g-left');
      const r = document.getElementById('g-right');
      l.addEventListener('pointerdown', () => moveLeft = true);
      l.addEventListener('pointerup', () => moveLeft = false);
      r.addEventListener('pointerdown', () => moveRight = true);
      r.addEventListener('pointerup', () => moveRight = false);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isPlaying) {
        if (moveLeft) player.position.x -= 0.1;
        if (moveRight) player.position.x += 0.1;

        jumpVel -= 0.012;
        player.position.y += jumpVel;

        platforms.forEach(p => {
          if (jumpVel < 0 && Math.abs(player.position.x - p.position.x) < 1.6 && Math.abs(player.position.y - (p.position.y + 0.5)) < 0.3) {
            jumpVel = 0.35;
            if (p.position.y > score) {
              score = Math.floor(p.position.y);
              coins += 1;
              document.getElementById('g-score').innerText = score + 'm';
              document.getElementById('g-coins').innerText = '🪙 ' + coins;
            }
          }
        });

        camera.position.set(player.position.x, player.position.y + 2.5, 8);
        camera.lookAt(player.position.x, player.position.y, 0);

        if (player.position.y < score - 8) { resetGame(); }
      }
      if (renderer) renderer.render(scene, camera);
    }
  </script>
</body>
</html>
