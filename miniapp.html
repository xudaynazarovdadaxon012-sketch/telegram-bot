<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Yordamchi</title>
  
  <!-- Telegram Mini App JS kutubxonasi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    /* Asosiy Dizayn - Neon / Dark Theme */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Kirish ekrani animatsiyasi */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 1s ease-out;
    }

    #splash-logo {
      font-size: 3rem;
      color: #00e676;
      text-shadow: 0 0 10px #00e676, 0 0 20px #00e676;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    /* Asosiy menyu */
    #main-content {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 400px;
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    .user-welcome {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .user-welcome span {
      color: #00e676;
    }

    /* Neon Tugmalar */
    .btn-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .neon-button {
      background: transparent;
      color: #00e676;
      border: 2px solid #00e676;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
      transition: all 0.2s ease;
      outline: none;
    }

    .neon-button:active, .neon-button.active {
      background: #00e676;
      color: #121212;
      box-shadow: 0 0 20px #00e676;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Kirish ekrani (Splash) -->
  <div id="splash-screen">
    <div id="splash-logo">⚡ Personal Bot</div>
    <p style="margin-top: 15px; color: #888;">Yuklanmoqda...</p>
  </div>

  <!-- Asosiy menyu -->
  <div id="main-content">
    <div class="user-welcome">
      Xush kelibsiz, <span id="user-name">Foydalanuvchi</span>!
    </div>

    <div class="btn-container">
      <button class="neon-button" id="btn-weather">☀️ Ob-havo Ma'lumotlari</button>
      <button class="neon-button" id="btn-currency">💱 Valyuta Kurslari</button>
      <button class="neon-button" id="btn-reminder">📝 Eslatma Qo'shish</button>
    </div>
  </div>

  <script>
    // Telegram Web App ob'ektini olish
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.addEventListener('DOMContentLoaded', function() {
      // 1. Foydalanuvchi ismini chiqarish
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        const userNameElem = document.getElementById('user-name');
        if (userNameElem) {
          userNameElem.innerText = user.first_name;
        }
      }

      // 2. Splash ekranini yashirish animatsiyasi
      setTimeout(function() {
        const splash = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');

        if (splash) splash.style.opacity = '0';

        setTimeout(function() {
          if (splash) splash.style.display = 'none';
          if (mainContent) {
            mainContent.style.display = 'flex';
            setTimeout(() => { mainContent.style.opacity = '1'; }, 10);
          }
        }, 1000);
      }, 2500);

      // 3. Tugmalar hodisalari (Endi tg.close() chaqirilmaydi, dastur yopilmaydi)
      const btnWeather = document.getElementById('btn-weather');
      if (btnWeather) {
        btnWeather.addEventListener('click', () => {
          alert("☀️ Ob-havo bo'limi tanlandi!");
        });
      }

      const btnCurrency = document.getElementById('btn-currency');
      if (btnCurrency) {
        btnCurrency.addEventListener('click', () => {
          alert("💱 Valyuta kursi bo'limi tanlandi!");
        });
      }

      const btnReminder = document.getElementById('btn-reminder');
      if (btnReminder) {
        btnReminder.addEventListener('click', () => {
          alert("📝 Eslatma qo'shish bo'limi tanlandi!");
        });
      }
    });
  </script>
</body>
</html>
