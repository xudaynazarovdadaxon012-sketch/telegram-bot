<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub Analitika</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #212d3b);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #0088cc;
        }
        .chart-container {
            position: relative;
            margin: 20px 0;
            height: 220px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #2ea6ff;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📊 Tizim Statistikasi</h2>
        <div class="chart-container">
            <canvas id="statsChart"></canvas>
        </div>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Jami A'zolar</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="vipUsers">0</div>
                <div class="stat-label">VIP A'zolar</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // URL parametrlaridan ma'lumotlarni olish
        const urlParams = new URLSearchParams(window.location.search);
        const total = parseInt(urlParams.get('total')) || 0;
        const vip = parseInt(urlParams.get('vip')) || 0;
        const regular = Math.max(total - vip, 0);

        document.getElementById('totalUsers').innerText = total;
        document.getElementById('vipUsers').innerText = vip;

        // 0 dan o'sadigan animatsiyali diagramma (Chart.js)
        const ctx = document.getElementById('statsChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Oddiy a\'zolar', 'VIP a\'zolar'],
                datasets: [{
                    data: [regular, vip],
                    backgroundColor: ['#0088cc', '#ffcc00'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    animateScale: true,
                    animateRotate: true,
                    duration: 1500
                },
                plugins: {
                    legend: {
                        labels: { color: '#ffffff' }
                    }
                }
            }
        });
    </script>
</body>
</html>
