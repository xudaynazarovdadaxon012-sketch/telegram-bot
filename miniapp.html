<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Cyber Hub + Monetization</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-controller.js"></script>
    <style>
        :root {
            --bg-color: #080b10;
            --card-bg: #0f172a;
            --border-color: #1e293b;
            --accent-cyan: #00f2ff;
            --accent-gold: #ffd700;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .user-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .module-btn {
            background: #1e293b;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .module-btn.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 255, 0.1);
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }

        .action-btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .stars-btn {
            background: linear-gradient(45deg, #ffaa00, #ff5500);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="user-card">
        <div>
            <h2 id="username" style="margin:0; font-size:16px;">𓆩D a d a x o n𓆪</h2>
            <small style="color:var(--accent-cyan)">Ultra Cyber Hub</small>
        </div>
        <div style="text-align: right;">
            <span id="user-coins" style="font-size: 20px; font-weight: bold; color: var(--accent-gold);">0</span> 🪙
        </div>
    </div>

    <!-- 10 modul iconlari -->
    <div class="modules-grid">
        <button class="module-btn active" onclick="switchTab(1)">⚡</button>
        <button class="module-btn" onclick="switchTab(2)">⏱️</button>
        <button class="module-btn" onclick="switchTab(3)">🔮</button>
        <button class="module-btn" onclick="switchTab(4)">📅</button> <!-- Daily Bonus -->
        <button class="module-btn" onclick="switchTab(5)">🎯</button>
        <button class="module-btn" onclick="switchTab(6)">🎰</button> <!-- Wheel Spin -->
        <button class="module-btn" onclick="switchTab(7)">💰</button> <!-- Adsgram -->
        <button class="module-btn" onclick="switchTab(8)">⭐</button> <!-- Stars Payment -->
        <button class="module-btn" onclick="switchTab(9)">🎲</button>
        <button class="module-btn" onclick="switchTab(10)">📊</button>
    </div>

    <div class="content-card" id="tab-content">
        <!-- Tab kontentlari dinamik ravishda o'zgaradi -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(moduleNum) {
            const btns = document.querySelectorAll('.module-btn');
            btns.forEach((btn, idx) => btn.classList.toggle('active', idx === moduleNum - 1));

            const content = document.getElementById('tab-content');

            if (moduleNum === 4) {
                // Kunlik bonus (Daily Streak)
                content.innerHTML = `
                    <h3>📅 Kunlik Bonus (Streak)</h3>
                    <p>Har kuni kirib bonus oling va tangalaringizni ko'paytiring!</p>
                    <button class="action-btn" onclick="claimStreak()">🎁 Bugungi bonusni olish</button>`;
            } else if (moduleNum === 6) {
                // Omad g'ildiragi
                content.innerHTML = `
                    <h3>🎰 Omad G'ildiragi</h3>
                    <p>Aylantiring va tasodifiy mukofot yutib oling!</p>
                    <button class="action-btn" onclick="spinWheel()">🎡 G'ildirakni aylantirish (10 Coins)</button>`;
            } else if (moduleNum === 8) {
                // Telegram Stars orqali VIP olish
                content.innerHTML = `
                    <h3>⭐ Premium / Donat (Stars)</h3>
                    <p>Telegram Stars orqali VIP maqom va reklamasiz rejimni yoqing.</p>
                    <button class="action-btn stars-btn" onclick="buyStarsVIP()">⭐ 50 Stars - VIP Maqom</button>`;
            } else if (moduleNum === 7) {
                // Adsgram reklama
                content.innerHTML = `
                    <h3>💰 Reklama Ko'rish</h3>
                    <p>Har bir ko'rilgan reklama uchun +30 coins beriladi.</p>
                    <button class="action-btn" onclick="showAd()">📺 Reklama ko'rish</button>`;
            } else {
                content.innerHTML = `<h3>Modul #${moduleNum}</h3><p>Modul faol holatda.</p>`;
            }
        }

        // Boshlang'ich tab
        switchTab(1);

        function claimStreak() {
            tg.showAlert("🎉 Kunlik bonus olindi!");
        }

        function spinWheel() {
            const prizes = [10, 20, 50, 100, 0];
            const win = prizes[Math.floor(Math.random() * prizes.length)];
            tg.showAlert(`🎉 Siz ${win} coins yutib oldingiz!`);
        }

        function buyStarsVIP() {
            // Telegram Stars to'lovini chaqirish
            tg.openInvoice("https://t.me/invoice_link_here");
        }

        function showAd() {
            tg.showAlert("📺 Reklama ko'rildi! +30 Coins berildi.");
        }
    </script>
</body>
</html>
