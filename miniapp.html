<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Games Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #0088cc;
        }
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin: 10px 0 5px 0;
            font-size: 16px;
        }
        .btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">🎮 Mini App O'yinlar Hubi</div>

    <div class="card-grid">
        <div class="card">
            <div>🚀</div>
            <h3>Flappy Bird</h3>
            <button class="btn" onclick="playGame('Flappy Bird')">O'ynash</button>
        </div>
        <div class="card">
            <div>🧩</div>
            <h3>2048 Puzzle</h3>
            <button class="btn" onclick="playGame('2048')">O'ynash</button>
        </div>
        <div class="card">
            <div>🎯</div>
            <h3>Tic Tac Toe</h3>
            <button class="btn" onclick="playGame('Tic Tac Toe')">O'ynash</button>
        </div>
        <div class="card">
            <div>🏎️</div>
            <h3>Speed Racer</h3>
            <button class="btn" onclick="playGame('Speed Racer')">O'ynash</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Telegram oynasini to'liq ekranga yoyish

        function playGame(gameName) {
            tg.showAlert(gameName + " o'yini yuklanmoqda...");
        }
    </script>
</body>
</html>
