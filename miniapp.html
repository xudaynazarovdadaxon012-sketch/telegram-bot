<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: rgba(25, 26, 35, 0.7);
            --accent-color: #f3ba2f;
            --accent-glow: rgba(243, 186, 47, 0.4);
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(243, 186, 47, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(34, 197, 94, 0.05) 0%, transparent 30%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 20px 16px;
            overflow: hidden;
        }

        /* Header dizayni */
        .header {
            text-align: center;
            width: 100%;
            animation: fadeInDown 0.6s ease;
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .balance {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent-color);
            margin-top: 5px;
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: -1px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 12px;
        }

        .stat-badge {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-badge span {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Markaziy Tap Tugmasi va Animatsiyalar */
        .tap-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        .tap-button {
            width: 230px;
            height: 230px;
            background: radial-gradient(circle, #fcd34d 0%, #f59e0b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            box-shadow: 0 0 40px var(--accent-glow), inset 0 4px 10px rgba(255, 255, 255, 0.4);
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            user-select: none;
            position: relative;
            z-index: 2;
        }

        .tap-button:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Bosilganda uchib chiqadigan tanga raqamlari animatsiyasi */
        .floating-number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-90px) scale(1.2);
            }
        }

        /* Energiya paneli */
        .bottom-panel {
            width: 100%;
            max-width: 400px;
            animation: fadeInUp 0.6s ease;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .energy-bar-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            height: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2px;
        }

        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #4ade80);
            border-radius: 8px;
            width: 100%;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        /* Pastki Menyu (Nav-bar) */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 20px;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-btn span {
            font-size: 18px;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--accent-color);
        }

        /* Modallar (Oyna dizayni) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: #181922;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 20px;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Do'kon va Vazifa kartochkalari */
        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .item-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .item-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-info small {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .action-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            color: #000;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .completed-badge {
            color: var(--success);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-title">Umumiy Balans</div>
        <div class="balance" id="balance">0</div>
        <div class="stats">
            <div class="stat-badge">📈 Passiv: <span id="passiveIncome">0</span>/soat</div>
        </div>
    </div>

    <div class="tap-container" id="tapContainer">
        <div class="tap-button" id="tapBtn">🪙</div>
    </div>

    <div class="bottom-panel">
        <div class="energy-info">
            <span>⚡ Energiya</span>
            <span><span id="energy">1000</span> / <span id="maxEnergy">1000</span></span>
        </div>
        <div class="energy-bar-container">
            <div class="energy-bar" id="energyBar"></div>
        </div>
        
        <div class="nav-bar">
            <button class="nav-btn active" onclick="openModal('shopModal')"><span>⚡</span>Do'kon</button>
            <button class="nav-btn" onclick="openModal('tasksModal'); loadTasks();"><span>🎯</span>Vazifalar</button>
            <button class="nav-btn" onclick="claimDaily()"><span>🎁</span>Bonus</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Kuchaytirgichlar</h2>
                <button class="close-btn" onclick="closeModal('shopModal')">&times;</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <h4>Tap Quvvati</h4>
                    <small>Har bir bosish uchun +1 ball</small>
                </div>
                <button class="action-btn" onclick="buyUpgrade('tap_power')">Olish</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <h4>Max Energiya</h4>
                    <small>+500 energiya sig'imi</small>
                </div>
                <button class="action-btn" onclick="buyUpgrade('max_energy')">Olish</button>
            </div>
            <div class="item-card">
                <div class="item-info">
                    <h4>Passiv Miner</h4>
                    <small>Soatlik daromadni oshirish</small>
                </div>
                <button class="action-btn" onclick="buyUpgrade('passive_income')">Olish</button>
            </div>
        </div>
    </div>

    <!-- Tasks Modal -->
    <div id="tasksModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Homiylik Vazifalari</h2>
                <button class="close-btn" onclick="closeModal('tasksModal')">&times;</button>
            </div>
            <div id="tasksList">
                <!-- Dinamik yuklanadi -->
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const telegramId = tg.initDataUnsafe?.user?.id || 123456789;

        let userState = {
            balance: 0,
            energy: 1000,
            max_energy: 1000,
            tap_power: 1,
            passive_income: 0
        };

        async function fetchUserData() {
            try {
                const response = await fetch('/api/user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
                const data = await response.json();
                if (data.balance !== undefined) {
                    userState = data;
                    updateUI();
                }
            } catch (e) {
                console.error("Xatolik:", e);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(userState.balance).toLocaleString();
            document.getElementById('energy').innerText = userState.energy;
            document.getElementById('maxEnergy').innerText = userState.max_energy;
            document.getElementById('passiveIncome').innerText = userState.passive_income;
            
            const percent = Math.max(0, Math.min(100, (userState.energy / userState.max_energy) * 100));
            document.getElementById('energyBar').style.width = percent + '%';
        }

        // Tap effekti va uchuvchi raqamlar
        const tapBtn = document.getElementById('tapBtn');
        const tapContainer = document.getElementById('tapContainer');

        tapBtn.addEventListener('click', async (e) => {
            // Telefonning o'zida vibratsiya berish (Telegram Haptic Feedback)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Sichqoncha yoki barmoq bosilgan joyga uchuvchi raqam chiqarish
            const rect = tapBtn.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);

            showFloatingNumber(x, y, `+${userState.tap_power}`);

            try {
                const response = await fetch('/api/tap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
                const data = await response.json();
                if (data.success) {
                    userState.balance = data.balance;
                    userState.energy = data.energy;
                    updateUI();
                }
            } catch (err) {
                console.error("Tap xatolik:", err);
            }
        });

        function showFloatingNumber(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-number';
            el.innerText = text;
            el.style.left = `${x - 15}px`;
            el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        async function buyUpgrade(type) {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            try {
                const response = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, type: type })
                });
                const data = await response.json();
                if (data.success) {
                    userState.balance = data.balance;
                    if(data.max_energy) userState.max_energy = data.max_energy;
                    if(data.tap_power) userState.tap_power = data.tap_power;
                    if(data.passive_income) userState.passive_income = data.passive_income;
                    updateUI();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    alert("Muvaffaqiyatli xarid qilindi!");
                } else {
                    alert(data.error);
                }
            } catch (e) {
                console.error("Upgrade xatolik:", e);
            }
        }

        async function claimDaily() {
            try {
                const response = await fetch('/api/daily', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
                const data = await response.json();
                if (data.success) {
                    userState.balance = data.balance;
                    updateUI();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    alert("Kunlik bonus olindi (+500 tanga)!");
                } else {
                    alert(data.error);
                }
            } catch (e) {
                console.error("Daily xatolik:", e);
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
                const data = await response.json();
                const container = document.getElementById('tasksList');
                container.innerHTML = '';
                
                data.tasks.forEach(task => {
                    container.innerHTML += `
                        <div class="item-card">
                            <div class="item-info">
                                <h4>${task.title}</h4>
                                <small>Mukofot: +${task.reward} tanga</small>
                            </div>
                            ${task.completed ? '<div class="completed-badge">✅ Bajarilgan</div>' : `<button class="action-btn" onclick="completeTask(${task.id}, '${task.channel_username}')">A'zo bo'lish</button>`}
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Tasks load error:", e);
            }
        }

        async function completeTask(taskId, channelUsername) {
            window.open(`https://t.me/${channelUsername}`, '_blank');

            setTimeout(async () => {
                const response = await fetch('/api/tasks/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, task_id: taskId })
                });
                const data = await response.json();
                if (data.success) {
                    userState.balance = data.balance;
                    updateUI();
                    loadTasks();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    alert("Mukofot berildi!");
                } else {
                    alert(data.error);
                }
            }, 3000);
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        setInterval(fetchUserData, 2500);
        fetchUserData();
    </script>
</body>
</html>
