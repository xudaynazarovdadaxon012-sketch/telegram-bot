<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Yordamchi Mini App</title>
    <!-- Telegram Mini App rasmiy JS kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Asosiy Dizayn - Neon Dark Theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Kirish Ekrani (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }

        #splash-logo {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: pulse 1.8s infinite;
        }

        /* Pulsatsiya Animatsiyasi */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 25px #38bdf8; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Asosiy Kontent */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 85%;
            max-width: 400px;
            opacity: 0;
            transition: opacity 0.8s ease-in;
        }

        /* Dynamic Salomlashuv */
        #user-welcome {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            color: #f8fafc;
        }

        #user-name {
            color: #38bdf8;
        }

        /* Neon Tugmalar */
        .neon-button {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 16px;
            margin: 8px 0;
            width: 100%;
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }

        .neon-button:hover, .neon-button:active {
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 20px #38bdf8;
            transform: translateY(-2px);
        }

        .neon-button.active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- 1. Splash Ekran -->
    <div id="splash-screen">
        <div id="splash-logo">🤖</div>
        <p style="color: #94a3b8; font-size: 0.9rem;">Yuklanmoqda...</p>
    </div>

    <!-- 2. Asosiy Menyu -->
    <div id="main-content">
        <div id="user-welcome">Assalomu alaykum, <span id="user-name">Foydalanuvchi</span>! 👋</div>
        
        <button class="neon-button" id="btn-weather">🌤 Ob-havo</button>
        <button class="neon-button" id="btn-currency">🔱 Valyuta kursi</button>
        <button class="neon-button" id="btn-reminder">📝 Eslatma qo'shish</button>
        <button class="neon-button" id="btn-games">🎮 O'yinlar</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Telegram ilovasini kengaytirish

        document.addEventListener('DOMContentLoaded', function() {
            // Telegram foydalanuvchi ismini olish
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
            }

            // Animatsiyali Splash Screen almashtirish
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-content');
                
                splash.style.opacity = '0';
                setTimeout(function() {
                    splash.style.display = 'none';
                    main.style.display = 'flex';
                    setTimeout(() => { main.style.opacity = '1'; }, 50);
                }, 800);
            }, 2000);

            // Tugmalar bosilganda Telegram'ga signal yuborish
            function sendAction(actionCode) {
                tg.sendData(actionCode);
                tg.close();
            }

            document.getElementById('btn-weather').addEventListener('click', () => sendAction('A:WEATHER'));
            document.getElementById('btn-currency').addEventListener('click', () => sendAction('A:CURRENCY'));
            document.getElementById('btn-reminder').addEventListener('click', () => sendAction('A:ADD_REMINDER'));
            document.getElementById('btn-games').addEventListener('click', () => sendAction('A:GAMES'));

            // Tugmalarga bosish effekti
            const buttons = document.querySelectorAll('.neon-button');
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', () => btn.classList.add('active'));
                btn.addEventListener('touchend', () => btn.classList.remove('active'));
            });
        });
    </script>
</body>
</html>
