<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega AI & Games Suite</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(22, 27, 46, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --accent: #00f2fe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Plus Jakarta Sans', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff; }

    .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .view.active { display: flex; flex-direction: column; }

    /* HEADER */
    .app-header { background: rgba(13, 17, 30, 0.8); backdrop-filter: blur(12px); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 20; }
    .app-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-game-launch { 
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); 
      color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; 
      box-shadow: 0 4px 15px rgba(255, 8, 68, 0.3); transition: 0.2s;
    }
    .btn-game-launch:active { transform: scale(0.95); }

    /* HUB GRID */
    .hub-container { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; align-content: start; }
    .hub-card { 
      background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(10px); 
      border-radius: 20px; padding: 20px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; transition: 0.3s;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .hub-card:active { transform: scale(0.96); }
    .hub-icon-wrap { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .hub-title { font-size: 13px; font-weight: 700; color: #f1f5f9; }
    .hub-desc { font-size: 10px; color: #64748b; margin-top: -4px; }

    /* CARD CUSTOM STYLES */
    .card-ai-chat .hub-icon-wrap { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2)); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }
    .card-ai-img .hub-icon-wrap { background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(244, 63, 94, 0.2)); color: #ec4899; border: 1px solid rgba(236, 72, 153, 0.3); }
    .card-media .hub-icon-wrap { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2)); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .card-kripto .hub-icon-wrap { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.2)); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .card-link .hub-icon-wrap { background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2)); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }
    .card-trans .hub-icon-wrap { background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.2)); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3); }
    .card-qr .hub-icon-wrap { background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(139, 92, 246, 0.2)); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .card-admin .hub-icon-wrap { background: linear-gradient(135deg, rgba(100, 116, 139, 0.2), rgba(71, 85, 105, 0.2)); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    /* TOOL BODY STYLES */
    .tool-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .btn-back { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; width: fit-content; font-size: 12px; }
    
    input, textarea { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 14px; padding: 14px; color: #fff; outline: none; font-size: 14px; transition: 0.2s; }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99, 102, 241, 0.3); }

    .btn-action { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border: none; padding: 14px; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }

    /* CUSTOM TOOL STYLINGS */
    /* AI Chat UI */
    .chat-box { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 380px; padding-right: 4px; }
    .chat-msg { padding: 12px 16px; border-radius: 16px; font-size: 13px; max-width: 85%; line-height: 1.5; }
    .chat-msg.user { background: #4f46e5; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg.ai { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border); color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; }

    /* Crypto UI */
    .crypto-card { background: rgba(30, 41, 59, 0.5); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .crypto-info { display: flex; align-items: center; gap: 10px; }
    .crypto-price { font-weight: 700; font-family: 'Space Grotesk', sans-serif; }

    /* Admin UI */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .stat-card { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
    .stat-value { font-size: 22px; font-weight: 800; color: #00f2fe; font-family: 'Space Grotesk', sans-serif; }

    /* GAME VIEW */
    #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    .game-hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
    .hud-box { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 14px; border: 1px solid var(--border); font-weight: 800; font-size: 14px; }
    .game-ctrl { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 24px; z-index: 10; }
    .btn-ctrl { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 24px; touch-action: manipulation; }
  </style>
</head>
<body>

  <!-- MAIN HUB -->
  <div id="view-hub" class="view active">
    <div class="app-header">
      <div class="app-title">MEGA AI SUITE</div>
      <button class="btn-game-launch" onclick="openGame()">🎮 3D GAME</button>
    </div>
    <div class="hub-container">
      <div class="hub-card card-ai-chat" onclick="openTool('ai-chat')">
        <div class="hub-icon-wrap">🤖</div>
        <div class="hub-title">AI Assistant</div>
        <div class="hub-desc">GPT-4o aqlli chat</div>
      </div>
      <div class="hub-card card-ai-img" onclick="openTool('ai-rasm')">
        <div class="hub-icon-wrap">🎨</div>
        <div class="hub-title">AI Studio</div>
        <div class="hub-desc">Rasm yaratish</div>
      </div>
      <div class="hub-card card-media" onclick="openTool('media-dl')">
        <div class="hub-icon-wrap">⚡</div>
        <div class="hub-title">Downloader</div>
        <div class="hub-desc">Media yuklagich</div>
      </div>
      <div class="hub-card card-kripto" onclick="openTool('kripto')">
        <div class="hub-icon-wrap">📈</div>
        <div class="hub-title">Crypto Live</div>
        <div class="hub-desc">Bozor kurslari</div>
      </div>
      <div class="hub-card card-link" onclick="openTool('link-short')">
        <div class="hub-icon-wrap">🔗</div>
        <div class="hub-title">Short Link</div>
        <div class="hub-desc">Link qisqartirish</div>
      </div>
      <div class="hub-card card-trans" onclick="openTool('tarjimon')">
        <div class="hub-icon-wrap">🌐</div>
        <div class="hub-title">Translator</div>
        <div class="hub-desc">Ko'p tilli tarjima</div>
      </div>
      <div class="hub-card card-qr" onclick="openTool('qr-gen')">
        <div class="hub-icon-wrap">📱</div>
        <div class="hub-title">QR Creator</div>
        <div class="hub-desc">QR kod yaratish</div>
      </div>
      <div class="hub-card card-admin" onclick="openTool('admin')">
        <div class="hub-icon-wrap">📊</div>
        <div class="hub-title">Analytics</div>
        <div class="hub-desc">Tizim statistikasi</div>
      </div>
    </div>
  </div>

  <!-- TOOL VIEW -->
  <div id="view-tool" class="view">
    <div class="app-header">
      <button class="btn-back" onclick="showHub()">◄ Orqaga</button>
      <div class="app-title" id="tool-title" style="font-size:14px;">XIZMAT</div>
    </div>
    <div class="tool-body" id="tool-content"></div>
  </div>

  <!-- 3D GAME VIEW -->
  <div id="view-game" class="view">
    <div class="game-hud">
      <div class="hud-box" style="color:#00f2fe;" id="g-score">0m</div>
      <button class="btn-back" onclick="showHub()" style="pointer-events:auto;">✕ Chiqish</button>
      <div class="hud-box" style="color:#ffd700;" id="g-coins">🪙 0</div>
    </div>
    <div class="game-ctrl">
      <div class="btn-ctrl" id="g-left">◄</div>
      <div class="btn-ctrl" id="g-right">►</div>
    </div>
    <div id="webgl-container"></div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); tg.ready(); }

    function showHub() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-hub').classList.add('active');
    }

    function openGame() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-game').classList.add('active');
      init3DGame();
    }

    function openTool(type) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-tool').classList.add('active');
      const title = document.getElementById('tool-title');
      const content = document.getElementById('tool-content');

      if (type === 'ai-chat') {
        title.innerText = 'AI ASSISTANT (GPT-4o)';
        content.innerHTML = `
          <div class="chat-box" id="chat-box">
            <div class="chat-msg ai">Assalomu alaykum! Men GPT-4o AI yordamchisiman. Nimada yordam bera olaman?</div>
          </div>
          <div style="display:flex; gap:8px;">
            <input id="chat-in" placeholder="Xabar yozing..." onkeypress="if(event.key==='Enter') sendAiChat()">
            <button class="btn-action" style="width: auto; padding: 0 20px;" onclick="sendAiChat()">➤</button>
          </div>
        `;
      } else if (type === 'ai-rasm') {
        title.innerText = 'AI IMAGE STUDIO';
        content.innerHTML = `
          <input id="img-prompt" placeholder="Rasm tavsifini yozing (masalan: Futuristic city at night)...">
          <button class="btn-action" onclick="generateImage(this)">Rasm Yaratish 🎨</button>
          <div id="img-result" style="text-align:center; margin-top:10px;"></div>
        `;
      } else if (type === 'kripto') {
        title.innerText = 'CRYPTO LIVE PRICES';
        content.innerHTML = `
          <div class="crypto-card">
            <div class="crypto-info"><span style="font-size:24px;">₿</span><div><b>Bitcoin</b><br><small style="color:#64748b;">BTC/USD</small></div></div>
            <div class="crypto-price" style="color:#10b981;">$64,280.00</div>
          </div>
          <div class="crypto-card">
            <div class="crypto-info"><span style="font-size:24px;">Ξ</span><div><b>Ethereum</b><br><small style="color:#64748b;">ETH/USD</small></div></div>
            <div class="crypto-price" style="color:#10b981;">$3,490.50</div>
          </div>
          <div class="crypto-card">
            <div class="crypto-info"><span style="font-size:24px;">💎</span><div><b>Toncoin</b><br><small style="color:#64748b;">TON/USD</small></div></div>
            <div class="crypto-price" style="color:#10b981;">$6.85</div>
          </div>
        `;
      } else if (type === 'media-dl') {
        title.innerText = 'MEDIA DOWNLOADER';
        content.innerHTML = `
          <input placeholder="Instagram, TikTok yoki YouTube linkini qo'ying...">
          <button class="btn-action" onclick="simpleAction(this, 'Fayl tayyorlandi! Yuklab olish boshlandi.')">Yuklab Olish 📥</button>
          <div class="output-box" style="margin-top:10px;"></div>
        `;
      } else if (type === 'link-short') {
        title.innerText = 'LINK QISQARTIRISH';
        content.innerHTML = `
          <input placeholder="https://juda-uzun-havola-manzili.com/path...">
          <button class="btn-action" onclick="simpleAction(this, 'Qisqa link: https://clck.ru/3Ai9X')">Qisqartirish 🔗</button>
          <div class="output-box" style="margin-top:10px;"></div>
        `;
      } else if (type === 'tarjimon') {
        title.innerText = 'AI TARJIMON';
        content.innerHTML = `
          <textarea placeholder="Tarjima qilish uchun matn kiriting..."></textarea>
          <button class="btn-action" onclick="simpleAction(this, 'Tarjima muvaffaqiyatli bajarildi.')">Tarjima Qilish 🌐</button>
          <div class="output-box" style="margin-top:10px;"></div>
        `;
      } else if (type === 'qr-gen') {
        title.innerText = 'QR KOD YARATISH';
        content.innerHTML = `
          <input placeholder="Matn yoki URL kiriting...">
          <button class="btn-action" onclick="simpleAction(this, 'QR Kod tayyorlandi!')">QR Yaratish 📱</button>
          <div class="output-box" style="margin-top:10px;"></div>
        `;
      } else if (type === 'admin') {
        title.innerText = 'SYSTEM ANALYTICS';
        content.innerHTML = `
          <div class="stat-grid">
            <div class="stat-card"><div class="stat-value">2,840</div><small style="color:#94a3b8;">Foydalanuvchilar</small></div>
            <div class="stat-card"><div class="stat-value">18.4k</div><small style="color:#94a3b8;">AI So'rovlar</small></div>
            <div class="stat-card"><div class="stat-value" style="color:#10b981;">99.9%</div><small style="color:#94a3b8;">Uptime</small></div>
            <div class="stat-card"><div class="stat-value" style="color:#f59e0b;">$450</div><small style="color:#94a3b8;">Kunlik daromad</small></div>
          </div>
        `;
      }
    }

    // AI CHAT
   // AI CHAT
async function sendAiChat() {
  const input = document.getElementById('chat-in');
  const box = document.getElementById('chat-box');
  if (!input || !input.value.trim()) return;

  const userText = input.value.trim();
  input.value = '';

  box.innerHTML += `<div class="chat-msg user">${userText}</div>`;
  box.scrollTop = box.scrollHeight;

  const aiMsg = document.createElement('div');
  aiMsg.className = 'chat-msg ai';
  aiMsg.innerText = "Javob tayyorlanmoqda... ⏳";
  box.appendChild(aiMsg);
  box.scrollTop = box.scrollHeight;

  try {
    const encodedPrompt = encodeURIComponent("Siz Telegram Mini App'dagi aqlli AI yordamchisiz. O'zbek tilida qisqa va aniq javob bering. Savol: " + userText);
    const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}?model=openai&seed=${Math.floor(Math.random() * 1000)}`);

    if (response.ok) {
      const reply = await response.text();
      aiMsg.innerText = reply;
    } else {
      const backupRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(userText)}`);
      if (backupRes.ok) {
        const backupReply = await backupRes.text();
        aiMsg.innerText = backupReply;
      } else {
        aiMsg.innerText = "AI serveri band, birozdan so'ng qayta urinib ko'ring.";
      }
    }
  } catch (err) {
    try {
      const fallbackRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(userText)}`);
      const fallbackText = await fallbackRes.text();
      aiMsg.innerText = fallbackText;
    } catch(e) {
      aiMsg.innerText = "Ulanish xatosi. Iltimos, internetingizni va so'rovni tekshiring.";
    }
  }
  box.scrollTop = box.scrollHeight;
}

    function generateImage(btn) {
      const prompt = document.getElementById('img-prompt').value;
      const res = document.getElementById('img-result');
      if (!prompt) return;

      btn.disabled = true;
      res.innerHTML = "<i>Rasm chizilmoqda... 🎨</i>";

      setTimeout(() => {
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=400&height=400&nologo=true`;
        res.innerHTML = `<img src="${imgUrl}" style="width:100%; border-radius:16px; margin-top:10px; border:1px solid var(--border);">`;
        btn.disabled = false;
      }, 1000);
    }

    function simpleAction(btn, text) {
      const parent = btn.parentElement;
      let out = parent.querySelector('.output-box');
      if (!out) {
        out = document.createElement('div');
        out.className = 'output-box';
        parent.appendChild(out);
      }
      out.style.background = 'rgba(15, 23, 42, 0.8)';
      out.style.border = '1px dashed var(--border)';
      out.style.padding = '12px';
      out.style.borderRadius = '12px';
      out.style.fontSize = '13px';
      out.style.color = '#e2e8f0';
      out.innerText = text;
    }

    // 3D GAME ENGINE
    let gameInited = false;
    let scene, camera, renderer, player, platforms = [];
    let score = 0, coins = 0, jumpVel = 0, isPlaying = false;
    let moveLeft = false, moveRight = false;

    function init3DGame() {
      const container = document.getElementById('webgl-container');
      if (!container) return;

      if (gameInited) { resetGame(); return; }
      gameInited = true;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070913);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const light = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(light);

      const pGeo = new THREE.SphereGeometry(0.6, 24, 24);
      const pMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
      player = new THREE.Mesh(pGeo, pMat);
      scene.add(player);

      resetGame();
      setupControls();
      animate();

      window.addEventListener('resize', () => {
        if (camera && renderer) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      });
    }

    function resetGame() {
      score = 0; coins = 0; jumpVel = 0.35; isPlaying = true;
      document.getElementById('g-score').innerText = '0m';
      document.getElementById('g-coins').innerText = '🪙 0';

      platforms.forEach(p => scene.remove(p));
      platforms = [];

      const platGeo = new THREE.BoxGeometry(3, 0.4, 3);
      const platMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });

      for(let i = 0; i < 20; i++) {
        const plat = new THREE.Mesh(platGeo, platMat);
        plat.position.set((Math.random() - 0.5) * 6, i * 3.2, 0);
        scene.add(plat);
        platforms.push(plat);
      }
      player.position.set(platforms[0].position.x, 1.5, 0);
    }

    function setupControls() {
      const l = document.getElementById('g-left');
      const r = document.getElementById('g-right');

      l.addEventListener('pointerdown', () => moveLeft = true);
      l.addEventListener('pointerup', () => moveLeft = false);
      r.addEventListener('pointerdown', () => moveRight = true);
      r.addEventListener('pointerup', () => moveRight = false);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') moveLeft = true;
        if (e.key === 'ArrowRight') moveRight = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') moveLeft = false;
        if (e.key === 'ArrowRight') moveRight = false;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isPlaying && player) {
        if (moveLeft) player.position.x -= 0.1;
        if (moveRight) player.position.x += 0.1;

        jumpVel -= 0.012;
        player.position.y += jumpVel;

        platforms.forEach(p => {
          if (jumpVel < 0 && Math.abs(player.position.x - p.position.x) < 1.6 && Math.abs(player.position.y - (p.position.y + 0.5)) < 0.3) {
            jumpVel = 0.35;
            if (p.position.y > score) {
              score = Math.floor(p.position.y);
              coins += 1;
              document.getElementById('g-score').innerText = score + 'm';
              document.getElementById('g-coins').innerText = '🪙 ' + coins;
            }
          }
        });

        camera.position.set(player.position.x, player.position.y + 2.5, 8);
        camera.lookAt(player.position.x, player.position.y, 0);

        if (player.position.y < score - 8) { resetGame(); }
      }
      if (renderer && scene && camera) renderer.render(scene, camera);
    }
  </script>
</body>
</html>
