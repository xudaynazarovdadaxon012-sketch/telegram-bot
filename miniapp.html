<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilon O'yini</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
    }
    #gameCanvas {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 8px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #ef4444;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>Ilon O'yini</h2>
  <canvas id="gameCanvas" width="300" height="300"></canvas>

  <!-- YUTQIZGANDA CHIQADIGAN OYNA (ALERT O'RNIGA) -->
  <div id="gameOverModal" class="modal">
    <h3 style="color: #ef4444; margin: 0;">Yutqizdingiz! 😞</h3>
    <p>Ochko: <span id="finalScore">0</span></p>
    <button class="btn" onclick="restartGame()">Qayta o'ynash 🔄</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const grid = 15;
    let count = 0;
    let score = 0;
    let isGameOver = false; // Xatolikni oldini oluvchi bayroq

    let snake = {
      x: 150,
      y: 150,
      dx: grid,
      dy: 0,
      cells: [],
      maxCells: 4
    };

    let apple = { x: 60, y: 60 };

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function loop() {
      // Agar yutqizgan bo'lsa, siklni to'xtatamiz
      if (isGameOver) return;

      requestAnimationFrame(loop);

      if (++count < 6) return; // O'yin tezligi
      count = 0;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snake.x += snake.dx;
      snake.y += snake.dy;

      // Devorga urilish
      if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
        endGame();
        return;
      }

      snake.cells.unshift({ x: snake.x, y: snake.y });

      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // Olmani chizish
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      // Ilonni chizish
      ctx.fillStyle = '#10b981';
      snake.cells.forEach((cell, index) => {
        ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        // Olmani yeyish
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          apple.x = getRandomInt(0, 20) * grid;
          apple.y = getRandomInt(0, 20) * grid;
        }

        // O'ziga urilish
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            endGame();
            return;
          }
        }
      });
    }

    function endGame() {
      isGameOver = true; // Siklni to'xtatish
      document.getElementById("finalScore").innerText = score;
      document.getElementById("gameOverModal").style.display = "block";
    }

    function restartGame() {
      snake.x = 150;
      snake.y = 150;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = grid;
      snake.dy = 0;
      score = 0;
      isGameOver = false;
      document.getElementById("gameOverModal").style.display = "none";
      requestAnimationFrame(loop);
    }

    // Boshqarish
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
      else if (e.key === "ArrowUp" && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
      else if (e.key === "ArrowRight" && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
      else if (e.key === "ArrowDown" && snake.dy === 0) { snake.dy = 0; snake.dx = grid; }
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
