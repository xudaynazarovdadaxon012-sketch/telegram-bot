<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 10px; text-align: center; }
        .game-card { background: #2a2a2a; border-radius: 10px; padding: 15px; margin: 10px 0; cursor: pointer; border: 1px solid #444; }
        .game-card:hover { background: #333; }
        #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
        iframe { width: 100%; height: 90%; border: none; }
        .close-btn { height: 10%; background: red; color: white; border: none; width: 100%; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🎮 Mini O'yinlar</h2>

    <!-- O'YINLAR RO'YXATI -->
    <div class="game-card" onclick="openGame('https://html5gameengine.com/embed/2048')">
        3D 2048 O'yini
    </div>
    
    <div class="game-card" onclick="openGame('https://playtictactoe.org/')">
        Tic Tac Toe (X-O)
    </div>

    <!-- O'YIN OYNASI (IFRAME) -->
    <div id="game-container">
        <button class="close-btn" onclick="closeGame()">O'yindan chiqish ❌</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // Telegram WebApp obyektini faollashtirish
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-container').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>
</body>
</html>
