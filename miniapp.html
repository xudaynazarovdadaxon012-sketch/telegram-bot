<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Premium Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0088cc;
            --primary-glow: rgba(0, 136, 204, 0.4);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px 40px;
            overflow-x: hidden;
        }

        /* HEADER ANIMATSIYASI */
        .header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        /* GRID ZAMONAVIY TUZILISHI */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* CARD ANIMATSIYA VA GLASSMORPHISM */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out backwards;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transform: scale(0);
            transition: transform 0.6s ease;
        }

        .card:active::before, .card:hover::before {
            transform: scale(1);
        }

        .card:active {
            transform: scale(0.94);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* ICON ANIMATION */
        .icon-box {
            width: 55px;
            height: 55px;
            margin: 0 auto 12px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #38bdf8;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover .icon-box {
            transform: rotate(8deg) scale(1.1);
            color: #818cf8;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* FULLSCREEN MODAL & IFRAME */
        #game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            animation: zoomIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #game-frame {
            width: 100%;
            height: calc(100% - 50px);
            border: none;
        }

        .close-btn {
            height: 50px;
            width: 100%;
            background: linear-gradient(90deg, #ef4444, #dc2626);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 -4px 20px rgba(239, 68, 68, 0.4);
        }

        /* KEYFRAME ANIMATIONLARI */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* GRID STAGGERED ANIMATION DELAY */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-gamepad"></i> GameHub Premium</h1>
        <p>Telegram Mini App O'yin Portali</p>
    </div>

    <div class="grid">
        <div class="card" onclick="openGame('https://games.famobi.com/om-nom-run')">
            <div class="icon-box"><i class="fa-solid fa-person-running"></i></div>
            <h3>Om Nom Run</h3>
        </div>
        <div class="card" onclick="openGame('https://games.famobi.com/cut-the-rope')">
            <div class="icon-box"><i class="fa-solid fa-frog"></i></div>
            <h3>Cut the Rope</h3>
        </div>
        <div class="card" onclick="openGame('https://games.famobi.com/bubble-tower-3d')">
            <div class="icon-box"><i class="fa-solid fa-cubes-stacked"></i></div>
            <h3>Bubble Tower 3D</h3>
        </div>
        <div class="card" onclick="openGame('https://games.famobi.com/element-blocks')">
            <div class="icon-box"><i class="fa-solid fa-shapes"></i></div>
            <h3>Element Blocks</h3>
        </div>
        <div class="card" onclick="openGame('https://games.famobi.com/cannon-balls-3d')">
            <div class="icon-box"><i class="fa-solid fa-bomb"></i></div>
            <h3>Cannon Balls 3D</h3>
        </div>
        <div class="card" onclick="openGame('https://games.famobi.com/table-tennis-world-tour')">
            <div class="icon-box"><i class="fa-solid fa-table-tennis-paddle-ball"></i></div>
            <h3>Table Tennis</h3>
        </div>
    </div>

    <div id="game-modal">
        <button class="close-btn" onclick="closeGame()"><i class="fa-solid fa-xmark"></i> O'YINDAN CHIQISH</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-modal').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>
</body>
</html>
