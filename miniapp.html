<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #0088cc;
            --gold: #ffd700;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            padding: 16px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .glass-card:active {
            transform: scale(0.97);
            border-color: var(--accent);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vip-badge {
            display: none;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 10px;
        }

        .vip-badge.active {
            display: inline-block;
        }

        /* Tap Particle FX */
        .particle-coin {
            position: fixed;
            pointer-events: none;
            font-weight: 800;
            font-size: 24px;
            color: #ff2a85;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 999;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        .btn-action {
            width: 100%;
            background: var(--accent);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="glass-card">
        <div class="user-header">
            <span id="user-tag">@username</span>
            <span id="vip-tag" class="vip-badge">VIP 👑</span>
        </div>
        <h1 id="main-balance" style="margin: 8px 0 0 0; font-size: 32px;">$0.00</h1>
        <p style="margin: 4px 0 0 0; color: #8a8d93;">Tangalar: <span id="coin-count" style="color: #fff; font-weight: bold;">0</span> 🪙</p>
    </div>

    <!-- Tap Game Section -->
    <div class="glass-card" onclick="handleTap(event)" style="text-align: center; padding: 40px 20px;">
        <h2>🎮 Tap & Earn</h2>
        <p style="color: #8a8d93;">Bosing va har safar real tanga yuting</p>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let isVip = false;

        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0b0e14');

            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById("user-tag").innerText = user.username ? `@${user.username}` : user.first_name;
                
                // Backend Rest API orqali ma'lumotlarni tortish
                fetch(`/api/user/${user.id}`)
                    .then(res => res.json())
                    .then(data => {
                        document.getElementById("main-balance").innerText = `$${(data.balance || 0).toFixed(2)}`;
                        document.getElementById("coin-count").innerText = data.coins || 0;
                        if (data.is_vip) {
                            isVip = true;
                            document.getElementById("vip-tag").classList.add("active");
                        }
                    }).catch(() => {});
            }
        }

        function triggerHaptic(style = 'medium') {
            tg?.HapticFeedback?.impactOccurred(style);
        }

        function handleTap(event) {
            triggerHaptic('light');

            const coinGain = isVip ? 20 : 10; // VIP bo'lsa 2x ko'proq coin
            const particle = document.createElement('div');
            particle.className = 'particle-coin';
            particle.innerText = `+${coinGain} 🪙`;

            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;

            particle.style.left = `${x - 20}px`;
            particle.style.top = `${y - 20}px`;

            document.body.appendChild(particle);

            setTimeout(() => particle.remove(), 800);
        }
    </script>
</body>
</html>
